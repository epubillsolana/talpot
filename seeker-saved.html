<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talpot — Guardados</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="talpot-style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Space Grotesk', sans-serif; color: #fff; overflow: hidden; }
    body { background: linear-gradient(180deg, #061426 0%, #0A2540 40%, #10406E 75%, #1264B8 100%); }
    .nav { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; background: rgba(6,20,38,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.07); z-index: 50; }
    .nav-logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
    .nav-logo span { color: #FFD60A; }
    .seeker-badge { font-size: 0.62rem; font-weight: 800; padding: 0.3rem 0.7rem; border-radius: 100px; background: rgba(0,180,216,0.15); color: #00B4D8; border: 1px solid rgba(0,180,216,0.35); }
    .scroll { position: fixed; inset: 0; padding-top: 56px; padding-bottom: 78px; overflow-y: auto; }
    .scroll::-webkit-scrollbar { display: none; }
    .header { padding: 1.3rem 1.25rem 0.5rem; }
    .h-title { font-size: 1.5rem; font-weight: 900; }
    .h-sub { font-size: 0.82rem; color: rgba(255,255,255,0.65); margin-top: 0.25rem; }

    .tag-filters { display: flex; gap: 0.5rem; padding: 0.9rem 1.25rem; overflow-x: auto; }
    .tag-filters::-webkit-scrollbar { display: none; }
    .tag-chip { flex-shrink: 0; font-size: 0.78rem; font-weight: 700; padding: 0.5rem 0.9rem; border-radius: 100px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.14); cursor: pointer; white-space: nowrap; }
    .tag-chip.active { background: rgba(255,214,10,0.15); border-color: #FFD60A; color: #FFD60A; }

    .section { padding: 0 1.25rem; }
    .saved-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1rem; margin-bottom: 0.6rem; }
    .saved-top { display: flex; align-items: center; gap: 0.85rem; cursor: pointer; }
    .saved-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg,#FFD60A,#FF6B00); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 900; color: #020B18; flex-shrink: 0; overflow: hidden; }
    .saved-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .saved-info { flex: 1; min-width: 0; }
    .saved-nom { font-size: 0.92rem; font-weight: 800; }
    .saved-nota { font-size: 0.78rem; color: rgba(255,255,255,0.6); margin-top: 0.2rem; font-style: italic; }
    .saved-stars { display: flex; gap: 0.1rem; }
    .saved-star { font-size: 0.95rem; cursor: pointer; color: rgba(255,255,255,0.2); }
    .saved-star.on { color: #FFD60A; }
    .saved-tags-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px solid rgba(255,255,255,0.07); }
    .saved-tag { font-size: 0.72rem; font-weight: 700; padding: 0.3rem 0.7rem; border-radius: 100px; background: rgba(0,180,216,0.12); color: #00B4D8; border: 1px solid rgba(0,180,216,0.3); }
    .saved-tag-x { cursor: pointer; margin-left: 0.3rem; opacity: 0.6; }
    .saved-add-tag { font-size: 0.72rem; padding: 0.3rem 0.7rem; border-radius: 100px; background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.25); color: rgba(255,255,255,0.5); cursor: pointer; }
    .remove-saved { font-size: 0.72rem; color: rgba(255,69,58,0.7); font-weight: 700; cursor: pointer; margin-top: 0.5rem; text-align: center; }

    .empty { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2.5rem 1.5rem; text-align: center; margin: 0 1.25rem; }
    .empty-icon { font-size: 2.6rem; margin-bottom: 0.6rem; }
    .empty-text { font-size: 0.85rem; color: rgba(255,255,255,0.6); line-height: 1.7; }
    .footer-space { height: 1.5rem; }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-logo">tal<span>pot</span></div>
    <div class="seeker-badge">🔖 GUARDADOS</div>
  </nav>

  <div class="scroll">
    <div class="header">
      <div class="h-title">🔖 Candidatos guardados</div>
      <div class="h-sub">Tu propia lista, con tus etiquetas y valoración de interés.</div>
    </div>

    <div class="tag-filters" id="tag-filters" style="display:none;"></div>

    <div class="section">
      <div id="saved-list"><div style="font-size:0.85rem;color:rgba(255,255,255,0.5);padding:1rem 0;">⏳ Cargando...</div></div>
    </div>

    <div class="footer-space"></div>
  </div>

  <nav class="nav-bottom" style="position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:0.55rem 0 calc(0.55rem + env(safe-area-inset-bottom));background:rgba(6,20,38,0.94);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,0.07);z-index:50;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.15rem;font-size:0.58rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;" onclick="window.location.href='seeker.html'">
      <div style="font-size:1.15rem;">🎯</div><span>Buscar</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.15rem;font-size:0.58rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;" onclick="window.location.href='seeker-discover.html'">
      <div style="font-size:1.15rem;">🧭</div><span>Descubrir</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.15rem;font-size:0.58rem;font-weight:800;color:#FFD60A;cursor:pointer;" onclick="window.location.href='seeker-saved.html'">
      <div style="font-size:1.15rem;">🔖</div><span>Guardados</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.15rem;font-size:0.58rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;position:relative;" onclick="window.location.href='messages.html?from=seeker'">
      <div style="font-size:1.15rem;">💬</div><span>Candidatos</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.15rem;font-size:0.58rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;" onclick="window.location.href='seeker-panel.html'">
      <div style="font-size:1.15rem;">⚙️</div><span>Mi cuenta</span>
    </div>
  </nav>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient('https://dlxeqzdgsejoywwwnchi.supabase.co', 'sb_publishable_TVNU00LDMRirtOJ1dCg5vA_-PhbsDJo');
    let myId = null;
    let guardats = [];
    let filtreTag = null;

    async function init() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      myId = user.id;
      await load();
    }

    async function load() {
      const { data } = await sb.from('candidatos_guardados').select('*').eq('seeker_id', myId).order('created_at', { ascending: false });
      guardats = data || [];
      if (guardats.length === 0) {
        document.getElementById('saved-list').innerHTML = '<div class="empty"><div class="empty-icon">🔖</div><div class="empty-text">Aún no has guardado ningún candidato.<br>Desde el perfil de un candidato podrás guardarlo aquí con tus propias notas.</div></div>';
        return;
      }
      const ids = guardats.map(g => g.candidat_id);
      const { data: profiles } = await sb.from('profiles').select('id, full_name, avatar_url').in('id', ids);
      const nomMap = {}, avMap = {};
      (profiles || []).forEach(p => { nomMap[p.id] = p.full_name; avMap[p.id] = p.avatar_url; });

      const totsTags = [...new Set(guardats.flatMap(g => g.etiquetas || []))];
      const tagBox = document.getElementById('tag-filters');
      if (totsTags.length) {
        tagBox.style.display = 'flex';
        tagBox.innerHTML = '<div class="tag-chip ' + (!filtreTag ? 'active' : '') + '" onclick="setTagFilter(null)">Todos</div>' +
          totsTags.map(t => '<div class="tag-chip ' + (filtreTag === t ? 'active' : '') + '" onclick="setTagFilter(\'' + t.replace(/'/g,"\\'") + '\')">' + t + '</div>').join('');
      } else { tagBox.style.display = 'none'; }

      const visibles = filtreTag ? guardats.filter(g => (g.etiquetas || []).includes(filtreTag)) : guardats;
      document.getElementById('saved-list').innerHTML = visibles.map(g => {
        const nom = nomMap[g.candidat_id] || 'Talent Talpot';
        const av = avMap[g.candidat_id];
        const avatarHtml = av ? '<img src="' + av + '">' : nom.charAt(0).toUpperCase();
        const estrelles = [1,2,3,4,5].map(s => '<span class="saved-star ' + (s <= (g.valoracion || 0) ? 'on' : '') + '" onclick="rate(\'' + g.id + '\',' + s + ')">★</span>').join('');
        const tags = (g.etiquetas || []).map(t => '<span class="saved-tag">' + t + '<span class="saved-tag-x" onclick="removeTag(\'' + g.id + '\',\'' + t.replace(/'/g,"\\'") + '\')">✕</span></span>').join('');
        return '<div class="saved-card">' +
          '<div class="saved-top" onclick="window.location.href=\'creator-profile.html?user=' + g.candidat_id + '\'">' +
            '<div class="saved-avatar">' + avatarHtml + '</div>' +
            '<div class="saved-info"><div class="saved-nom">' + nom + '</div>' +
              (g.nota ? '<div class="saved-nota">"' + g.nota + '"</div>' : '') +
            '</div>' +
            '<div class="saved-stars">' + estrelles + '</div>' +
          '</div>' +
          '<div class="saved-tags-row">' + tags + '<span class="saved-add-tag" onclick="addTag(\'' + g.id + '\')">＋ etiqueta</span></div>' +
          '<div class="remove-saved" onclick="removeSaved(\'' + g.id + '\')">Quitar de guardados</div>' +
        '</div>';
      }).join('');
    }

    function setTagFilter(t) { filtreTag = t; load(); }

    async function rate(id, val) {
      try { await sb.from('candidatos_guardados').update({ valoracion: val }).eq('id', id); } catch(e) {}
      load();
    }
    async function addTag(id) {
      const t = prompt('Añade una etiqueta o nota corta (ej: "Para el puesto de Reus", "Muy interesante"):');
      if (!t || !t.trim()) return;
      const g = guardats.find(x => x.id === id);
      const nuevas = [...(g.etiquetas || []), t.trim()];
      try { await sb.from('candidatos_guardados').update({ etiquetas: nuevas }).eq('id', id); } catch(e) {}
      load();
    }
    async function removeTag(id, tag) {
      const g = guardats.find(x => x.id === id);
      const nuevas = (g.etiquetas || []).filter(t => t !== tag);
      try { await sb.from('candidatos_guardados').update({ etiquetas: nuevas }).eq('id', id); } catch(e) {}
      load();
    }
    async function removeSaved(id) {
      if (!confirm('¿Quitar este candidato de guardados?')) return;
      try { await sb.from('candidatos_guardados').delete().eq('id', id); } catch(e) {}
      load();
    }

    init();
  </script>

</body>
</html>
