<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Talpot — Jocs</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; font-family: 'Space Grotesk', sans-serif; color: #fff; overflow: hidden; }
    body { background: linear-gradient(180deg, #020B18 0%, #041E3A 40%, #0D3B6E 75%, #1264B8 100%); }

    .nav { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; background: rgba(2,11,24,0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 50; }
    .nav-logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
    .nav-logo span { color: #FFD60A; }
    .nav-back { font-size: 1.1rem; cursor: pointer; color: rgba(255,255,255,0.85); font-weight: 700; }

    .view { position: fixed; inset: 0; padding-top: 56px; padding-bottom: 64px; overflow-y: auto; transition: opacity 0.25s; }
    .view.hidden { opacity: 0; pointer-events: none; }
    .view::-webkit-scrollbar { display: none; }

    .games-header { padding: 1.25rem 1.25rem 0.5rem; }
    .games-title { font-size: 1.5rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 0.2rem; }
    .games-sub { font-size: 0.82rem; color: rgba(255,255,255,0.6); }
    .games-grid { display: flex; flex-direction: column; gap: 0.55rem; padding: 0.75rem 1.25rem 1rem; }

    .game-card { border-radius: 16px; padding: 1rem 1.1rem; cursor: pointer; transition: transform 0.15s; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); display: flex; align-items: center; gap: 0.9rem; }
    .game-card:active { transform: scale(0.99); }
    .gc-icon { width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; flex-shrink: 0; background: rgba(255,255,255,0.07); }
    .gc-info { flex: 1; min-width: 0; }
    .gc-name { font-size: 0.92rem; font-weight: 800; margin-bottom: 0.15rem; }
    .gc-mesura { font-size: 0.75rem; color: rgba(255,255,255,0.6); line-height: 1.4; }
    .gc-right { text-align: right; flex-shrink: 0; }
    .gc-play { font-size: 0.72rem; font-weight: 800; padding: 0.35rem 0.8rem; border-radius: 100px; background: #FFD60A; color: #020B18; display: inline-block; margin-bottom: 0.25rem; }
    .gc-stats { font-size: 0.62rem; color: rgba(255,255,255,0.4); display: block; }

    .game-view { background: #020B18; }
    .game-header { padding: 0.85rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .gh-top { display: flex; align-items: center; gap: 0.75rem; }
    .gh-icon { font-size: 1.35rem; }
    .gh-name { font-size: 0.95rem; font-weight: 800; flex: 1; }
    .gh-enc { font-size: 0.78rem; color: #30D158; font-weight: 800; }
    .gh-err { font-size: 0.78rem; color: #FF453A; font-weight: 800; }
    .gh-count { font-size: 0.72rem; color: #FFD60A; font-weight: 700; }
    .gh-progress { font-size: 0.7rem; color: rgba(255,255,255,0.55); margin-top: 0.35rem; }

    .game-arena { padding: 1rem 1.25rem 2rem; }

    /* INSTRUCCIONS — molt més visibles */
    .info-strip { text-align: center; font-size: 0.92rem; font-weight: 700; color: #fff; background: rgba(255,214,10,0.1); border: 1px solid rgba(255,214,10,0.25); border-radius: 12px; padding: 0.7rem 0.9rem; margin-bottom: 0.9rem; line-height: 1.5; }
    .info-strip .accent { color: #FFD60A; }
    .rank-strip { display: flex; justify-content: center; gap: 1.25rem; font-size: 0.75rem; color: rgba(255,255,255,0.65); margin-bottom: 0.85rem; font-weight: 600; }
    .rank-strip strong { color: #FFD60A; }

    /* DECISIONS */
    .dr-situacio { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 1.15rem; margin-bottom: 1rem; font-size: 0.95rem; line-height: 1.65; min-height: 90px; }
    .dr-opcio { padding: 0.95rem 1rem; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); cursor: pointer; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.5rem; transition: all 0.15s; }
    .dr-opcio:active { background: rgba(255,214,10,0.15); border-color: #FFD60A; }

    /* MEMÒRIA */
    .mem-grid { display: grid; gap: 0.55rem; }
    .mem-card { aspect-ratio: 1; border-radius: 12px; border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; cursor: pointer; transition: all 0.2s; }
    .mem-card.revealed { background: rgba(255,214,10,0.12); border-color: rgba(255,214,10,0.4); }
    .mem-card.matched { background: rgba(48,209,88,0.14); border-color: #30D158; }
    .mem-card.face-down { font-size: 0; }
    .simon-cell { aspect-ratio: 1; border-radius: 14px; cursor: pointer; opacity: 0.25; transition: opacity 0.12s, transform 0.12s; }
    .simon-cell.lit { opacity: 1; transform: scale(1.06); box-shadow: 0 0 24px currentColor; }
    .pos-cell { aspect-ratio: 1; border-radius: 10px; background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.12); cursor: pointer; }
    .pos-cell.marked { background: rgba(255,214,10,0.4); border-color: #FFD60A; }
    .pos-cell.sel { background: rgba(0,180,216,0.35); border-color: #00B4D8; }
    .canvi-cover { position: absolute; inset: 0; background: #041426; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 2rem; z-index: 5; }

    /* SEQÜÈNCIES */
    .seq-items { display: flex; justify-content: center; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .seq-item { width: 56px; height: 56px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 800; color: #E8F4F8; }
    .seq-item svg { width: 40px; height: 40px; }
    .seq-missing { background: rgba(255,214,10,0.14); border-color: #FFD60A; color: #FFD60A; font-size: 1.4rem; }
    .seq-options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .seq-opt { min-height: 64px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.25rem; font-weight: 800; }
    .seq-opt svg { width: 40px; height: 40px; }
    .seq-opt:active { background: rgba(0,180,216,0.18); }

    /* SUDOKU */
    .sdk-diff { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; font-weight: 800; padding: 0.3rem 0.85rem; border-radius: 100px; margin-bottom: 0.75rem; }
    .sdk-grid { display: grid; grid-template-columns: repeat(9,1fr); gap: 1px; background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.28); border-radius: 8px; overflow: hidden; max-width: 400px; margin: 0 auto 0.85rem; }
    .sdk-cell { background: #041426; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; font-size: clamp(0.85rem, 3.4vw, 1.1rem); font-weight: 700; cursor: pointer; }
    .sdk-cell.given { color: #7FDBEE; }
    .sdk-cell.user { color: #FFD60A; }
    .sdk-cell.selected { background: rgba(255,214,10,0.2); }
    .sdk-cell.br { border-right: 2px solid rgba(255,255,255,0.32); }
    .sdk-cell.bb { border-bottom: 2px solid rgba(255,255,255,0.32); }
    .sdk-pad { display: grid; grid-template-columns: repeat(5,1fr); gap: 0.4rem; max-width: 400px; margin: 0 auto; }
    .sdk-num { padding: 0.75rem; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); text-align: center; cursor: pointer; font-size: 1.05rem; font-weight: 800; }
    .sdk-num:active { background: rgba(0,180,216,0.25); }
    .sdk-erase { color: #FF453A; }

    /* ZIP — fons blanc, parets negres */
    .zip-board { background: #F7F6F2; border-radius: 18px; padding: 10px; margin: 0 auto 0.85rem; width: fit-content; box-shadow: 0 8px 28px rgba(0,0,0,0.4); }
    .zip-grid { display: grid; gap: 0; touch-action: none; position: relative; }
    .zip-cell { background: #FFFFFF; border: 1px solid #D8D6CF; display: flex; align-items: center; justify-content: center; position: relative; }
    .zip-cell.path { background: #FFE566; }
    .zip-wall-r { border-right: 4px solid #111 !important; }
    .zip-wall-b { border-bottom: 4px solid #111 !important; }
    .zip-num-badge { width: 72%; height: 72%; border-radius: 50%; background: #111; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.82rem; z-index: 2; }
    .zip-cell.path .zip-num-badge { background: #020B18; }
    .zip-actions { display: flex; gap: 0.6rem; justify-content: center; }
    .zip-btn { padding: 0.65rem 1.4rem; border-radius: 100px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.82rem; cursor: pointer; }

    /* REFLEXOS */
    .rf-area { border-radius: 20px; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; cursor: pointer; padding: 1.5rem; text-align: center; transition: background 0.1s; }
    .rf-big { font-size: 1.6rem; font-weight: 900; }
    .rf-sub { font-size: 0.85rem; opacity: 0.8; font-weight: 600; }
    .stroop-word { font-size: 2.6rem; font-weight: 900; text-align: center; margin: 1.25rem 0; letter-spacing: 1px; }
    .stroop-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .stroop-opt { padding: 1rem; border-radius: 14px; text-align: center; font-weight: 800; font-size: 0.95rem; cursor: pointer; border: 2px solid; }
    .intru-grid { display: grid; gap: 0.4rem; }
    .intru-cell { aspect-ratio: 1; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .counter-num { font-size: 4rem; font-weight: 900; text-align: center; color: #FFD60A; margin: 1.5rem 0; font-variant-numeric: tabular-nums; }
    .stop-btn { width: 100%; padding: 1.2rem; border-radius: 100px; border: none; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 1.2rem; background: #FF453A; color: #fff; cursor: pointer; }
    .noto-area { position: relative; height: 320px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
    .noto-dot { position: absolute; width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900; cursor: pointer; animation: dotIn 0.15s ease; }
    @keyframes dotIn { from { transform: scale(0); } to { transform: scale(1); } }

    /* PRIORITATS */
    .prio-item { padding: 1rem; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); display: flex; align-items: center; gap: 0.75rem; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.55rem; user-select: none; touch-action: none; transition: transform 0.15s, box-shadow 0.15s; }
    .prio-item.lifting { background: rgba(255,214,10,0.12); border-color: #FFD60A; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 10; position: relative; }
    .prio-handle { color: rgba(255,255,255,0.45); font-size: 1.2rem; }
    .prio-check { padding: 0.9rem; border-radius: 100px; border: none; font-family: 'Space Grotesk', sans-serif; font-weight: 800; background: #FFD60A; color: #020B18; cursor: pointer; font-size: 0.95rem; width: 100%; margin-top: 0.5rem; }

    /* DETALL */
    .diff-scene { background: #EAF4FB; border-radius: 14px; overflow: hidden; margin-bottom: 0.6rem; box-shadow: 0 4px 16px rgba(0,0,0,0.35); }
    .diff-scene svg { display: block; width: 100%; height: auto; }
    .diff-found { font-size: 0.85rem; font-weight: 800; color: #FFD60A; text-align: center; margin-bottom: 0.6rem; }
    .wally-grid { display: grid; gap: 2px; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 6px; }
    .wally-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; cursor: pointer; border-radius: 4px; }
    .wally-cell:active { background: rgba(255,214,10,0.2); }
    .sopa-grid { display: grid; gap: 3px; margin: 0 auto 0.85rem; width: fit-content; }
    .sopa-cell { width: 38px; height: 38px; border-radius: 8px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem; cursor: pointer; }
    .sopa-cell.sel { background: rgba(255,214,10,0.3); border-color: #FFD60A; color: #FFD60A; }
    .sopa-cell.found { background: rgba(48,209,88,0.25); border-color: #30D158; color: #30D158; }

    /* EMOCIONAL */
    .emo-situacio { font-size: 0.98rem; line-height: 1.7; color: #fff; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 16px; padding: 1.2rem; margin-bottom: 0.85rem; }
    .emo-frase { font-size: 1.1rem; font-weight: 800; font-style: italic; text-align: center; color: #FFD60A; margin-bottom: 0.5rem; line-height: 1.5; }
    .emo-context { font-size: 0.82rem; color: rgba(255,255,255,0.6); text-align: center; margin-bottom: 1rem; }
    .emo-opt { padding: 0.95rem 1rem; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); font-weight: 600; font-size: 0.87rem; cursor: pointer; margin-bottom: 0.5rem; line-height: 1.5; }
    .emo-opt:active { background: rgba(255,45,85,0.15); }

    /* TETRIS */
    .tetris-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .tetris-board { display: grid; gap: 1px; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); border-radius: 8px; overflow: hidden; }
    .tt-cell { background: #06182C; }
    .tetris-hud { display: flex; gap: 1.5rem; font-size: 0.82rem; font-weight: 800; }
    .tetris-hud strong { color: #FFD60A; }
    .tetris-pad { display: grid; grid-template-columns: repeat(3, 76px); grid-template-rows: 60px 60px; gap: 0.5rem; justify-content: center; }
    .tp-btn { border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.09); color: #fff; font-size: 1.5rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; }
    .tp-btn:active { background: rgba(255,214,10,0.25); }
    .tp-rotate { grid-column: 1 / 4; background: rgba(255,214,10,0.15); border-color: rgba(255,214,10,0.4); color: #FFD60A; }

    .feedback-flash { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 3rem; z-index: 100; pointer-events: none; animation: flashUp 0.7s ease forwards; }
    @keyframes flashUp { 0%{opacity:0;transform:translate(-50%,-40%) scale(0.6);} 30%{opacity:1;transform:translate(-50%,-50%) scale(1.1);} 100%{opacity:0;transform:translate(-50%,-70%) scale(1);} }

    .daily-result { text-align: center; padding: 2rem 1rem; }
    .ranking-list { max-width: 340px; margin: 1.25rem auto 0; text-align: left; }
    .rk-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.9rem; border-radius: 12px; margin-bottom: 0.4rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); font-size: 0.85rem; font-weight: 600; }
    .rk-row.me { background: rgba(255,214,10,0.12); border-color: rgba(255,214,10,0.4); }
    .rk-pos { font-weight: 900; color: rgba(255,255,255,0.5); width: 26px; }
    .rk-row.me .rk-pos { color: #FFD60A; }
    .rk-name { flex: 1; }
    .rk-val { font-weight: 800; color: #FFD60A; }

    .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; justify-content: space-around; background: rgba(2,11,24,0.92); backdrop-filter: blur(16px); border-top: 1px solid rgba(255,255,255,0.06); z-index: 50; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; cursor: pointer; opacity: 0.4; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; color: #fff; }
    .nav-item.active { opacity: 1; }
    .nav-item.active .nav-icon { color: #FFD60A; }
    .nav-icon { font-size: 1.3rem; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-back" id="nav-back" onclick="goBack()">← Feed</div>
    <div class="nav-logo">tal<span>pot</span></div>
    <div style="width:60px;"></div>
  </nav>

  <div class="view" id="view-list">
    <div class="games-header">
      <div class="games-title">🎮 Jocs</div>
      <div class="games-sub"></div>
    </div>
    <div class="games-grid" id="games-grid"></div>
  </div>

  <div class="view hidden game-view" id="view-game">
    <div class="game-header">
      <div class="gh-top">
        <div class="gh-icon" id="gh-icon">⚡</div>
        <div class="gh-name" id="gh-name">Joc</div>
        <div style="display:flex;gap:0.7rem;align-items:center;" id="gh-scores"></div>
      </div>
      <div class="gh-progress" id="gh-progress"></div>
    </div>
    <div class="game-arena" id="game-arena"></div>
  </div>

  <nav class="nav-bottom">
    <div class="nav-item" onclick="window.location.href='app.html'"><div class="nav-icon">🏠</div><span>Feed</span></div>
    <div class="nav-item" onclick="window.location.href='magic-room.html'"><div class="nav-icon">✨</div><span>Mi Room</span></div>
    <div class="nav-item" onclick="window.location.href='creators-feed.html'"><div class="nav-icon">👥</div><span>Creators</span></div>
    <div class="nav-item" onclick="window.location.href='profile.html'"><div class="nav-icon">👤</div><span>Perfil</span></div>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ═══════ SUPABASE — partides reals ═══════
    const sb = window.supabase.createClient(
      'https://dlxeqzdgsejoywwwnchi.supabase.co',
      'sb_publishable_TVNU00LDMRirtOJ1dCg5vA_-PhbsDJo'
    );
    let sbUser = null;
    sb.auth.getUser().then(({ data }) => { sbUser = data?.user || null; });

    function syncPartida(ok, val, unit) {
      // Fire-and-forget: guarda la partida al núvol si hi ha sessió
      if (!sbUser) return;
      sb.from('game_partides').insert({
        user_id: sbUser.id,
        game_id: currentGame,
        ok: ok,
        val: val ?? null,
        unit: unit || null,
      }).then(() => {}).catch(() => {});
    }
    // ═══════ SISTEMA DIARI + RNG ═══════
    let RNG = Math.random;
    function mulberry32(seed) {
      return function() {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function seedFrom(str) { let h = 0; for (let i = 0; i < str.length; i++) h = Math.imul(31, h) + str.charCodeAt(i) | 0; return h; }
    function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

    function loadDaily() { try { return JSON.parse(localStorage.getItem('talpot_daily')) || { done: {}, streak: 0, lastDate: '' }; } catch(e) { return { done: {}, streak: 0, lastDate: '' }; } }
    function saveDaily() { localStorage.setItem('talpot_daily', JSON.stringify(daily)); }
    const daily = loadDaily();
    let dailyMode = false;

    function dailyRecord(id) {
      const r = daily.done[id];
      if (!r) return null;
      if (typeof r === 'string') return r === todayStr() ? { date: r, val: null, ok: true } : null;
      return r.date === todayStr() ? r : null;
    }
    function isDailyDone(id) { return dailyRecord(id) !== null; }

    const NOMS = ['Marc V.','Laia P.','Pau R.','Anna S.','Jordi M.','Núria C.','Àlex F.','Clara B.','Oriol T.','Marta G.','Joan D.','Emma L.'];

    function completeDaily(ok, val, unit) {
      daily.done[currentGame] = { date: todayStr(), ok, val: val ?? null, unit: unit || '' };
      const avui = todayStr();
      if (daily.lastDate !== avui) {
        const ahir = new Date(); ahir.setDate(ahir.getDate() - 1);
        const ahirStr = ahir.getFullYear() + '-' + String(ahir.getMonth()+1).padStart(2,'0') + '-' + String(ahir.getDate()).padStart(2,'0');
        daily.streak = (daily.lastDate === ahirStr) ? daily.streak + 1 : 1;
        daily.lastDate = avui;
      }
      saveDaily();
      dailyMode = false;
      RNG = Math.random;
      showDailyResult();
    }

    function buildRanking(id, myVal, unit, lowerBetter) {
      // Rànquing estable del dia (seeded)
      const rng = mulberry32(seedFrom(todayStr() + '-rank-' + id));
      const others = [];
      const base = myVal ?? (lowerBetter ? 30 : 500);
      for (let i = 0; i < 5; i++) {
        const nom = NOMS[Math.floor(rng() * NOMS.length)];
        const factor = 0.6 + rng() * 0.9;
        others.push({ nom, val: Math.max(1, Math.round(base * factor)) });
      }
      const tots = [...others, { nom: 'Tu', val: myVal, me: true }];
      tots.sort((a, b) => lowerBetter ? a.val - b.val : b.val - a.val);
      return tots;
    }

    function drPending() {
      const p = localStorage.getItem('talpot_dr_pending');
      return p !== null ? parseInt(p) : null;
    }
    function renderDecisions() {
      let idx = drPending();
      if (idx === null || idx >= DECISIONS.length) {
        let used = [];
        try { used = JSON.parse(localStorage.getItem('talpot_dr_used')) || []; } catch(e) {}
        let avail = DECISIONS.map((_, i) => i).filter(i => !used.includes(i));
        if (!avail.length) { used = []; avail = DECISIONS.map((_, i) => i); }
        idx = avail[Math.floor(Math.random() * avail.length)];
        localStorage.setItem('talpot_dr_pending', idx);
        localStorage.setItem('talpot_dr_used', JSON.stringify(used));
      }
      const d = DECISIONS[idx];
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">⚡ No hi ha resposta correcta — <span class="accent">només la teva</span>. Cal contestar per passar a la següent.</div>
        <div class="dr-situacio">${d.s}</div>
        ${d.ops.map(op => `<div class="dr-opcio" onclick="drSelect(this, ${idx})">${op}</div>`).join('')}
      `;
    }
    function drSelect(el, idx) {
      el.style.background = 'rgba(255,214,10,0.18)'; el.style.borderColor = '#FFD60A';
      let used = [];
      try { used = JSON.parse(localStorage.getItem('talpot_dr_used')) || []; } catch(e) {}
      used.push(idx);
      localStorage.setItem('talpot_dr_used', JSON.stringify(used));
      localStorage.removeItem('talpot_dr_pending');
      addResposta();
      flash('✓', '#FFD60A');
      setTimeout(renderDecisions, 500);
    }

    // ═══════ 2. MEMÒRIA (4 variants) ═══════
    const EMOJI_SETS = [['🚀','⭐','🎯','💡','🔥','🌊','🎨','🏆'],['🦁','🐯','🦊','🐺','🦝','🐻','🦄','🐼'],['🍎','🍊','🍋','🍇','🍓','🥝','🍑','🍒'],['🎸','🎹','🎺','🎻','🥁','🎷','🪗','🎤']];
    const SIMON_COLORS = ['#FF453A','#30D158','#FFD60A','#00B4D8'];
    let memVariant = 0;

    function renderMemoria() {
      partidaActiva = true;
      [memParelles, memSimon, memPosicions, memCanvi, memGirada, memQuants][memVariant % 6]();
      memVariant++;
    }

    // Matriu girada — memoritza posicions, la graella gira 90°, marca on són ara
    let girMarked = [], girSel = [], girShow = true;
    function memGirada() {
      const size = 3, total = 9;
      const nMarks = Math.min(2 + Math.floor(stats.memoria.enc / 10), 4);
      girMarked = [];
      while (girMarked.length < nMarks) {
        const p = Math.floor(RNG() * total);
        if (!girMarked.includes(p)) girMarked.push(p);
      }
      girSel = []; girShow = true;
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip" id="gir-status">🔄 Memoritza — després la graella <span class="accent">girarà 90° a la dreta</span></div>
        <div class="mem-grid" style="grid-template-columns:repeat(3,1fr);max-width:250px;margin:0 auto;transition:transform 0.6s;" id="gir-grid">
          ${Array.from({length: total}, (_,i) => `<div class="pos-cell ${girMarked.includes(i) ? 'marked' : ''}" id="gir-${i}" onclick="girTap(${i})"></div>`).join('')}
        </div>`;
      setTimeout(() => {
        girShow = false;
        // Rotació 90° horària: la casella (r,c) passa a (c, size-1-r)
        girMarked = girMarked.map(i => {
          const r = Math.floor(i / size), c = i % size;
          return c * size + (size - 1 - r);
        });
        girMarked.forEach(() => {});
        document.querySelectorAll('#gir-grid .pos-cell').forEach(c => c.classList.remove('marked'));
        const grid = document.getElementById('gir-grid');
        grid.style.transform = 'rotate(90deg)';
        setTimeout(() => {
          grid.style.transition = 'none';
          grid.style.transform = 'none';
          document.getElementById('gir-status').innerHTML = 'La graella ha girat! Toca on són <span class="accent">ARA</span> les marcades';
        }, 700);
      }, 2400);
    }
    function girTap(i) {
      if (girShow || girSel.includes(i)) return;
      girSel.push(i);
      const cell = document.getElementById('gir-' + i);
      if (girMarked.includes(i)) {
        cell.classList.add('sel');
        if (girSel.filter(x => girMarked.includes(x)).length === girMarked.length) {
          partidaActiva = false; addEncert(); if (!dailyMode) setTimeout(renderMemoria, 800);
        }
      } else {
        cell.style.background = 'rgba(255,69,58,0.35)';
        partidaActiva = false; addError(); if (!dailyMode) setTimeout(renderMemoria, 900);
      }
    }

    // Quants n'hi havia — núvol d'elements breu, pregunta de quantitat
    function memQuants() {
      const set = EMOJI_SETS[Math.floor(RNG()*EMOJI_SETS.length)];
      const target = set[Math.floor(RNG()*set.length)];
      const nTarget = 3 + Math.floor(RNG()*4);
      const showTime = Math.max(1800, 3200 - stats.memoria.enc * 40);
      const cells = Array(nTarget).fill(target);
      while (cells.length < 15) {
        let other; do { other = set[Math.floor(RNG()*set.length)]; } while (other === target);
        cells.push(other);
      }
      cells.sort(() => RNG()-.5);
      const opts = [...new Set([nTarget, nTarget+1, Math.max(1,nTarget-1), nTarget+2])].sort(() => RNG()-.5);
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip" id="qt-status">👁️ Memoritza — et preguntaré <span class="accent">quants n'hi ha d'un tipus</span></div>
        <div class="mem-grid" id="qt-grid" style="grid-template-columns:repeat(5,1fr);">
          ${cells.map(c => `<div class="mem-card" style="font-size:1.2rem;cursor:default;">${c}</div>`).join('')}
        </div>
        <div id="qt-opts" style="margin-top:0.85rem;"></div>`;
      setTimeout(() => {
        document.getElementById('qt-grid').style.visibility = 'hidden';
        document.getElementById('qt-status').innerHTML = `Quants <span style="font-size:1.3rem;">${target}</span> hi havia?`;
        document.getElementById('qt-opts').innerHTML = `
          <div class="seq-options" style="grid-template-columns:repeat(4,1fr);">
            ${opts.map(o => `<div class="seq-opt" onclick="quantsTap(${o === nTarget})">${o}</div>`).join('')}
          </div>`;
      }, showTime);
    }
    function quantsTap(ok) {
      partidaActiva = false;
      if (ok) addEncert(); else addError();
      if (!dailyMode) setTimeout(renderMemoria, 700);
    }

    let mpFlip = [], mpMatch = 0, mpTot = 0, mpLock = false;
    function memParelles() {
      const pairs = Math.min(4 + Math.floor(stats.memoria.enc / 5), 8);
      const set = EMOJI_SETS[Math.floor(RNG()*EMOJI_SETS.length)].slice(0, pairs);
      const cards = [...set, ...set].sort(() => RNG()-.5);
      mpFlip = []; mpMatch = 0; mpTot = pairs; mpLock = false;
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">🃏 Troba les <span class="accent">${pairs} parelles</span> · <span class="accent" id="mem-timer">0s</span></div>
        ${rankStrip('memoria','s')}
        <div class="mem-grid" style="grid-template-columns:repeat(4,1fr);">
          ${cards.map(e => `<div class="mem-card face-down" data-e="${e}" onclick="mpFlipCard(this)"></div>`).join('')}
        </div>`;
      startGameTimer('mem-timer');
    }
    function mpFlipCard(c) {
      if (mpLock || c.classList.contains('matched') || c.classList.contains('revealed')) return;
      c.classList.remove('face-down'); c.classList.add('revealed'); c.textContent = c.dataset.e;
      mpFlip.push(c);
      if (mpFlip.length === 2) {
        mpLock = true;
        if (mpFlip[0].dataset.e === mpFlip[1].dataset.e) {
          mpFlip.forEach(x => { x.classList.remove('revealed'); x.classList.add('matched'); });
          mpFlip = []; mpLock = false; mpMatch++;
          if (mpMatch === mpTot) {
            clearInterval(gameTimerInterval);
            stats.memoria.temps.push(gameSeconds);
            partidaActiva = false;
            addEncert(gameSeconds, 's');
            if (!dailyMode) setTimeout(renderMemoria, 1100);
          }
        } else {
          setTimeout(() => {
            mpFlip.forEach(x => { x.classList.remove('revealed'); x.classList.add('face-down'); x.textContent = ''; });
            mpFlip = []; mpLock = false;
          }, 750);
        }
      }
    }

    // Simon — FIX: apagat clar entre passos (colors repetits distingibles)
    let simonSeq = [], simonInput = [], simonPlaying = false;
    function memSimon() {
      const len = 3 + Math.floor(stats.memoria.enc / 6);
      simonSeq = Array.from({length: len}, () => Math.floor(RNG()*4));
      simonInput = [];
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">👀 Memoritza la seqüència de <span class="accent">${len} colors</span> i repeteix-la</div>
        <div class="mem-grid" style="grid-template-columns:repeat(2,1fr);max-width:280px;margin:0 auto;">
          ${SIMON_COLORS.map((c,i) => `<div class="simon-cell" id="sim-${i}" style="background:${c};color:${c};" onclick="simonTap(${i})"></div>`).join('')}
        </div>
        <div class="info-strip" style="margin-top:0.85rem;" id="simon-status">Mira bé...</div>`;
      simonPlaying = true;
      let i = 0;
      function step() {
        if (i >= simonSeq.length) {

          return;
        }

        if (cell) cell.classList.add('lit');
        setTimeout(() => {
          if (cell) cell.classList.remove('lit');
          i++;
          setTimeout(step, 280); // GAP clar — repetits distingibles
        }, 480);
      }
      setTimeout(step, 700);
    }
    function simonTap(idx) {
      if (simonPlaying) return;
      const cell = document.getElementById('sim-' + idx);
      cell.classList.add('lit');
      setTimeout(() => cell.classList.remove('lit'), 180);
      simonInput.push(idx);
      const pos = simonInput.length - 1;
      if (simonSeq[pos] !== idx) { partidaActiva = false; addError(); if (!dailyMode) setTimeout(renderMemoria, 900); return; }
      if (simonInput.length === simonSeq.length) { partidaActiva = false; addEncert(); if (!dailyMode) setTimeout(renderMemoria, 900); }
    }

    // ═══════ 3. SEQÜÈNCIES — varietat IQ visual ═══════
    let seqAns = null, seqFallades = [];
    const SEQ_COLORS = ['#FF453A','#30D158','#FFD60A','#00B4D8','#BF5AF2'];

    function svgCircle(r, color) { return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="${r}" fill="${color}"/></svg>`; }
    function svgArrow(deg) { return `<svg viewBox="0 0 40 40" style="transform:rotate(${deg}deg);"><path d="M20 6 L30 24 L22 24 L22 34 L18 34 L18 24 L10 24 Z" fill="#7FDBEE"/></svg>`; }
    function svgDots(n, color) {
      const pos = [[20,20],[13,13],[27,27],[13,27],[27,13],[20,8],[20,32],[8,20],[32,20]];
      let c = '';
      for (let i = 0; i < n && i < 9; i++) c += `<circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="4.5" fill="${color}"/>`;
      return `<svg viewBox="0 0 40 40">${c}</svg>`;
    }
    function svgHalf(deg) { return `<svg viewBox="0 0 40 40" style="transform:rotate(${deg}deg);"><rect x="6" y="6" width="28" height="28" fill="none" stroke="#7FDBEE" stroke-width="3"/><path d="M6 6 L34 6 L34 34 Z" fill="#7FDBEE"/></svg>`; }

    function renderSequencies() {
      let seq;
      if (seqFallades.length > 0 && RNG() < 0.3) seq = seqFallades.shift();
      else {
        const gens = [genSeqNum, genSeqMida, genSeqRotacio, genSeqQuantitat, genSeqMeitat, genSeqPatro];
        seq = gens[Math.floor(RNG() * gens.length)]();
      }
      seqAns = seq.ans;
      window._seqActual = seq;
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">⚠️ <span class="accent">La primera resposta compta.</span> Si falles no veuràs la solució.</div>
        <div class="seq-items">
          ${seq.mostrats.map(m => `<div class="seq-item">${m}</div>`).join('')}
          <div class="seq-item seq-missing">?</div>
        </div>
        <div class="seq-options">
          ${seq.opts.map((o, i) => `<div class="seq-opt" data-i="${i}" onclick="seqCheck(this, ${i})">${o}</div>`).join('')}
        </div>`;
      window._seqCorrectIdx = seq.opts.indexOf(seq.ans);
    }

    function genSeqNum() {
      const d = Math.floor(stats.sequencies.enc / 5);
      const gens = [
        () => { const s = Math.floor(RNG()*10)+1, df = Math.floor(RNG()*4)+2+d; return { m:[s,s+df,s+df*2,s+df*3], a:s+df*4 }; },
        () => { const a = Math.floor(RNG()*5)+1, b = Math.floor(RNG()*5)+1, c = a+b, e = b+c; return { m:[a,b,c,e], a:c+e }; },
        () => { const s = Math.floor(RNG()*4)+1; return { m:[s*s,(s+1)**2,(s+2)**2,(s+3)**2], a:(s+4)**2 }; },
      ];
      const g = gens[Math.floor(RNG()*gens.length)]();
      const wrongs = [g.a+2, g.a-2, g.a+5].filter(w => w !== g.a && w > 0);
      const opts = [String(g.a), ...wrongs.map(String)].sort(() => RNG()-.5);
      return { mostrats: g.m.map(String), ans: String(g.a), opts };
    }
    function genSeqMida() {
      const color = SEQ_COLORS[Math.floor(RNG()*SEQ_COLORS.length)];
      const creix = RNG() < 0.5;
      const rs = creix ? [5, 9, 13, 17] : [17, 13, 9, 5];
      const ansR = creix ? 21 : 3;
      const m = rs.map(r => svgCircle(r, color));
      const ans = svgCircle(Math.max(2, ansR), color);
      const opts = [ans, svgCircle(creix ? 8 : 15, color), svgCircle(creix ? 13 : 9, color), svgCircle(creix ? 4 : 20, color)].sort(() => RNG()-.5);
      return { mostrats: m, ans, opts };
    }
    function genSeqRotacio() {
      const start = Math.floor(RNG()*4) * 90;
      const step = RNG() < 0.5 ? 90 : -90;
      const m = [0,1,2,3].map(i => svgArrow(start + step*i));
      const ans = svgArrow(start + step*4);
      const opts = [ans, svgArrow(start + step*4 + 90), svgArrow(start + step*4 + 180), svgArrow(start + step*4 - 90)].sort(() => RNG()-.5);
      return { mostrats: m, ans, opts };
    }
    function genSeqQuantitat() {
      const color = SEQ_COLORS[Math.floor(RNG()*SEQ_COLORS.length)];
      const start = Math.floor(RNG()*2)+1;
      const step = Math.floor(RNG()*2)+1;
      const m = [0,1,2,3].map(i => svgDots(start + step*i, color));
      const ansN = start + step*4;
      const ans = svgDots(ansN, color);
      const opts = [ans, svgDots(Math.max(1,ansN-1), color), svgDots(ansN+1, color), svgDots(Math.max(1,ansN-2), color)].sort(() => RNG()-.5);
      return { mostrats: m, ans, opts };
    }
    function genSeqMeitat() {
      const step = RNG() < 0.5 ? 90 : -90;
      const m = [0,1,2,3].map(i => svgHalf(step*i));
      const ans = svgHalf(step*4);
      const opts = [ans, svgHalf(step*4+90), svgHalf(step*4+180), svgHalf(step*4-90)].sort(() => RNG()-.5);
      return { mostrats: m, ans, opts };
    }
    function genSeqPatro() {
      const shapes = ['🔴','🔵','🟡','🟢','🟣','⭐','🔺','⬛'];
      const a = shapes[Math.floor(RNG()*shapes.length)];
      let b; do { b = shapes[Math.floor(RNG()*shapes.length)]; } while (b === a);
      let c; do { c = shapes[Math.floor(RNG()*shapes.length)]; } while (c === a || c === b);
      const pats = [
        { m:[a,b,a,b], ans:a }, { m:[a,a,b,a,a], ans:b }, { m:[a,b,c,a,b], ans:c }, { m:[a,b,b,a,b], ans:b },
      ];
      const p = pats[Math.floor(RNG()*pats.length)];
      const opts = [...new Set([p.ans, a, b, c])].slice(0,4).sort(() => RNG()-.5);
      return { mostrats: p.m, ans: p.ans, opts };
    }
    function seqCheck(el, i) {
      document.querySelectorAll('.seq-opt').forEach(o => o.style.pointerEvents = 'none');
      const ok = i === window._seqCorrectIdx;
      if (ok) {
        el.style.background = 'rgba(48,209,88,0.2)'; el.style.borderColor = '#30D158';
        addEncert();
      } else {
        el.style.background = 'rgba(255,69,58,0.15)'; el.style.borderColor = '#FF453A';
        seqFallades.push(window._seqActual);
        addError();
      }
      if (!dailyMode) setTimeout(renderSequencies, 700);
    }

    // ═══════ 4. SUDOKU — pistes distribuïdes + etiqueta dificultat ═══════
    let sdkSol = [], sdkGrid = [], sdkGiven = [], sdkSel = null;
    const SDK_DIFFS = [
      { nom:'🟢 Fàcil', pistes: 42, color:'#30D158' },
      { nom:'🟡 Mitjà', pistes: 34, color:'#FFD60A' },
      { nom:'🔴 Difícil', pistes: 28, color:'#FF453A' },
      { nom:'⚫ Super difícil', pistes: 24, color:'#BF5AF2' },
    ];

    function genSudoku9() {
      const base = [];
      for (let r = 0; r < 9; r++) {
        base.push([]);
        for (let c = 0; c < 9; c++) base[r].push((r*3 + Math.floor(r/3) + c) % 9 + 1);
      }
      for (let band = 0; band < 3; band++) {
        const rows = [band*3, band*3+1, band*3+2].sort(() => RNG()-.5);
        const copy = rows.map(r => base[r]);
        for (let i = 0; i < 3; i++) base[band*3+i] = copy[i];
      }
      for (let pile = 0; pile < 3; pile++) {
        const cols = [pile*3, pile*3+1, pile*3+2].sort(() => RNG()-.5);
        base.forEach(row => {
          const copy = cols.map(c => row[c]);
          for (let i = 0; i < 3; i++) row[pile*3+i] = copy[i];
        });
      }
      return base;
    }

    function renderSudoku() {
      partidaActiva = true;
      sdkSol = genSudoku9();
      sdkGrid = sdkSol.map(r => [...r]);
      const diff = SDK_DIFFS[Math.floor(RNG() * SDK_DIFFS.length)];
      // Distribució EQUILIBRADA: repartir pistes per caixes 3x3
      const perBox = Math.floor(diff.pistes / 9);
      const extra = diff.pistes % 9;
      const keep = new Set();
      for (let box = 0; box < 9; box++) {
        const br = Math.floor(box / 3) * 3, bc = (box % 3) * 3;
        const cells = [];
        for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) cells.push([br+r, bc+c]);
        cells.sort(() => RNG()-.5);
        const n = perBox + (box < extra ? 1 : 0);
        cells.slice(0, n).forEach(([r,c]) => keep.add(r*9+c));
      }
      for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
        if (!keep.has(r*9+c)) sdkGrid[r][c] = 0;
      }
      sdkGiven = sdkGrid.map(row => row.map(v => v !== 0));
      sdkSel = null;

      document.getElementById('game-arena').innerHTML = `
        <div style="text-align:center;"><span class="sdk-diff" style="background:${diff.color}20;color:${diff.color};border:1px solid ${diff.color}50;">${diff.nom} · ${diff.pistes} pistes</span></div>
        <div class="info-strip">🔲 1-9 per fila, columna i caixa · <span class="accent" id="sdk-timer">0s</span></div>
        ${rankStrip('sudoku','s')}
        <div class="sdk-grid" id="sdk-grid"></div>
        <div class="sdk-pad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<div class="sdk-num" onclick="sdkInput(${n})">${n}</div>`).join('')}
          <div class="sdk-num sdk-erase" onclick="sdkInput(0)">✕</div>
        </div>`;
      renderSdkGrid();
      startGameTimer('sdk-timer');
    }
    function renderSdkGrid() {
      const grid = document.getElementById('sdk-grid');
      if (!grid) return;
      grid.innerHTML = '';
      for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
        const cell = document.createElement('div');
        cell.className = 'sdk-cell' + (sdkGiven[r][c] ? ' given' : ' user')
          + (sdkSel && sdkSel[0] === r && sdkSel[1] === c ? ' selected' : '')
          + ((c === 2 || c === 5) ? ' br' : '') + ((r === 2 || r === 5) ? ' bb' : '');
        if (sdkGrid[r][c] !== 0) cell.textContent = sdkGrid[r][c];
        if (!sdkGiven[r][c]) cell.onclick = () => { sdkSel = [r,c]; renderSdkGrid(); };
        grid.appendChild(cell);
      }
    }
    function sdkInput(n) {
      if (!sdkSel) return;
      const [r,c] = sdkSel;
      sdkGrid[r][c] = n;
      renderSdkGrid();
      let complete = true;
      for (let rr = 0; rr < 9; rr++) for (let cc = 0; cc < 9; cc++) if (sdkGrid[rr][cc] === 0) complete = false;
      if (complete) {
        const correct = sdkGrid.every((row, rr) => row.every((v, cc) => v === sdkSol[rr][cc]));
        clearInterval(gameTimerInterval);
        partidaActiva = false;
        if (correct) { stats.sudoku.temps.push(gameSeconds); addEncert(gameSeconds, 's'); }
        else addError(gameSeconds, 's');
        if (!dailyMode) setTimeout(renderSudoku, 1100);
      }
    }

    // ═══════ 5. CAMÍ ZIP — 7x7, fons blanc, parets, 12 números ═══════
    let zipPath = [], zipCells = [], zipNums = {}, zipWalls = new Set(), zipSize = 7, zipTracking = false;

    function genZipPath(size) {
      // Camí hamiltonià amb GIRS reals — Warnsdorff aleatoritzat
      const total = size * size;
      for (let attempt = 0; attempt < 60; attempt++) {
        const visited = new Set();
        let cur = Math.floor(RNG() * total);
        const path = [cur];
        visited.add(cur);
        let stuck = false;
        while (path.length < total) {
          const r = Math.floor(cur / size), c = cur % size;
          const neighbors = [];
          [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc]) => {
            if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
              const idx = nr * size + nc;
              if (!visited.has(idx)) neighbors.push(idx);
            }
          });
          if (!neighbors.length) { stuck = true; break; }
          // Warnsdorff: tria el veí amb MENYS sortides lliures (desempata aleatori)
          neighbors.sort((a, b) => {
            const free = (i) => {
              const rr = Math.floor(i/size), cc = i%size;
              let n = 0;
              [[rr-1,cc],[rr+1,cc],[rr,cc-1],[rr,cc+1]].forEach(([x,y]) => {
                if (x >= 0 && x < size && y >= 0 && y < size && !visited.has(x*size+y)) n++;
              });
              return n;
            };
            return (free(a) - free(b)) || (RNG() - 0.5);
          });
          cur = neighbors[0];
          path.push(cur);
          visited.add(cur);
        }
        if (!stuck) return path;
      }
      // Fallback: serpentina
      let path = [];
      for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) path.push(r * size + (r % 2 === 0 ? c : size - 1 - c));
      return path;
    }

    function renderZip() {
      partidaActiva = true;
      zipSize = 7;
      const path = genZipPath(zipSize);
      const nNums = [6, 9, 12][Math.floor(RNG() * 3)];
      zipNums = {};
      for (let i = 0; i < nNums; i++) {
        const pos = i === 0 ? 0 : i === nNums-1 ? path.length-1 : Math.floor(i * (path.length-1) / (nNums-1));
        zipNums[path[pos]] = i + 1;
      }
      // PARETS: entre caselles adjacents que NO són consecutives al camí
      zipWalls = new Set();
      const idxInPath = {};
      path.forEach((cell, i) => idxInPath[cell] = i);
      const candidates = [];
      for (let r = 0; r < zipSize; r++) for (let c = 0; c < zipSize; c++) {
        const i = r*zipSize + c;
        if (c < zipSize-1) { const j = i+1; if (Math.abs(idxInPath[i]-idxInPath[j]) !== 1) candidates.push(i + 'R'); }
        if (r < zipSize-1) { const j = i+zipSize; if (Math.abs(idxInPath[i]-idxInPath[j]) !== 1) candidates.push(i + 'B'); }
      }
      candidates.sort(() => RNG()-.5);
      const nWalls = Math.min(10 + Math.floor(stats.zip.enc / 3), candidates.length);
      candidates.slice(0, nWalls).forEach(w => zipWalls.add(w));

      zipPath = [];
      zipTracking = false;
      const cellPx = Math.min(46, Math.floor((window.innerWidth - 90) / zipSize));

      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">🗺️ Arrossega: connecta <span class="accent">1→${nNums}</span> passant per TOTES les caselles. Les parets negres bloquegen. · <span class="accent" id="zip-timer">0s</span></div>
        ${rankStrip('zip','s')}
        <div class="zip-board">
          <div class="zip-grid" id="zip-grid" style="grid-template-columns:repeat(${zipSize},${cellPx}px);"></div>
        </div>
        <div class="zip-actions"><button class="zip-btn" onclick="zipPath=[];zipRender();">↺ Reiniciar camí</button></div>`;

      const grid = document.getElementById('zip-grid');
      zipCells = [];
      for (let i = 0; i < zipSize * zipSize; i++) {
        const cell = document.createElement('div');
        cell.className = 'zip-cell'
          + (zipWalls.has(i + 'R') ? ' zip-wall-r' : '')
          + (zipWalls.has(i + 'B') ? ' zip-wall-b' : '');
        cell.style.width = cellPx + 'px';
        cell.style.height = cellPx + 'px';
        cell.dataset.idx = i;
        if (zipNums[i]) cell.innerHTML = `<div class="zip-num-badge">${zipNums[i]}</div>`;
        grid.appendChild(cell);
        zipCells.push(cell);
      }
      grid.addEventListener('touchstart', zipTouch, { passive: false });
      grid.addEventListener('touchmove', zipTouch, { passive: false });
      grid.addEventListener('touchend', () => { zipTracking = false; zipCheckComplete(); });
      startGameTimer('zip-timer');
    }

    function zipTouch(e) {
      e.preventDefault();
      const touch = e.touches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      if (!el) return;
      const cell = el.closest('.zip-cell');
      if (!cell) return;
      const idx = parseInt(cell.dataset.idx);
      if (zipPath.length === 0) {
        if (zipNums[idx] === 1) { zipPath.push(idx); zipTracking = true; zipRender(); }
        return;
      }
      if (!zipTracking && e.type === 'touchstart') {
        if (idx === zipPath[zipPath.length-1]) zipTracking = true;
        return;
      }
      if (!zipTracking) return;
      const last = zipPath[zipPath.length-1];
      if (idx === last) return;
      if (zipPath.length >= 2 && idx === zipPath[zipPath.length-2]) { zipPath.pop(); zipRender(); return; }
      const r1 = Math.floor(last/zipSize), c1 = last%zipSize, r2 = Math.floor(idx/zipSize), c2 = idx%zipSize;
      if (Math.abs(r1-r2) + Math.abs(c1-c2) !== 1) return;
      // Paret entre les dues?
      if (c2 === c1+1 && zipWalls.has(last + 'R')) return;
      if (c2 === c1-1 && zipWalls.has(idx + 'R')) return;
      if (r2 === r1+1 && zipWalls.has(last + 'B')) return;
      if (r2 === r1-1 && zipWalls.has(idx + 'B')) return;
      if (zipPath.includes(idx)) return;
      if (zipNums[idx]) {
        const passats = zipPath.filter(p => zipNums[p]).map(p => zipNums[p]);
        if (zipNums[idx] !== Math.max(...passats) + 1) return;
      }
      zipPath.push(idx);
      zipRender();
    }
    function zipRender() { zipCells.forEach((c, i) => c.classList.toggle('path', zipPath.includes(i))); }
    function zipCheckComplete() {
      if (zipPath.length === zipSize * zipSize) {
        const passats = zipPath.filter(p => zipNums[p]).map(p => zipNums[p]);
        const ok = passats.every((n, i) => n === i + 1) && passats.length === Object.keys(zipNums).length;
        clearInterval(gameTimerInterval);
        partidaActiva = false;
        if (ok) { stats.zip.temps.push(gameSeconds); addEncert(gameSeconds, 's'); }
        else addError(gameSeconds, 's');
        if (!dailyMode) setTimeout(renderZip, 1000);
      }
    }

    // ═══════ 6. REFLEXOS — 7 variants ═══════
    let rfVariant = 0;
    function renderReflexos() {
      const variants = [rfReflex, rfStroop, rfIntrus, rfCounter, rfNoToquis, rfDoble, rfSeqRapida];
      variants[rfVariant % variants.length]();
      rfVariant++;
    }

    let rfState = 'wait', rfStart = 0, rfTimeout = null;
    function rfReflex() {
      rfState = 'wait';
      document.getElementById('game-arena').innerHTML = `
        ${rankStrip('reflexos','ms')}
        <div class="rf-area" id="rf-area" style="background:rgba(255,69,58,0.15);border:2px solid rgba(255,69,58,0.4);" onclick="rfTap()">
          <div class="rf-big">Espera...</div>
          <div class="rf-sub">Toca NOMÉS quan es posi VERDA. Compte amb els enganys!</div>
        </div>`;
      const fake = RNG() < 0.35;
      const delay = 1500 + RNG() * 2500;
      if (fake) {
        rfTimeout = setTimeout(() => {
          const area = document.getElementById('rf-area');
          if (area && rfState === 'wait') {
            area.style.background = 'rgba(255,159,10,0.3)'; area.style.borderColor = '#FF9F0A';
            area.innerHTML = '<div class="rf-big">Taronja... NO! 🚫</div>';
            setTimeout(() => {
              if (rfState !== 'wait') return;
              area.style.background = 'rgba(255,69,58,0.15)'; area.style.borderColor = 'rgba(255,69,58,0.4)';
              area.innerHTML = '<div class="rf-big">Espera...</div>';
              rfTimeout = setTimeout(rfGo, 800 + RNG() * 1800);
            }, 700);
          }
        }, delay * 0.6);
      } else {
        rfTimeout = setTimeout(rfGo, delay);
      }
    }
    function rfGo() {
      if (rfState !== 'wait') return;
      rfState = 'go'; rfStart = Date.now();
      const area = document.getElementById('rf-area');
      if (area) {
        area.style.background = 'rgba(48,209,88,0.28)'; area.style.borderColor = '#30D158';
        area.innerHTML = '<div class="rf-big">ARA! 👆</div>';
      }
    }
    function rfTap() {
      if (rfState === 'wait') {
        clearTimeout(rfTimeout); rfState = 'done';
        addError();
        document.getElementById('rf-area').innerHTML = '<div class="rf-big">Massa aviat! ⏱️</div>';
        if (!dailyMode) setTimeout(renderReflexos, 1000);
      } else if (rfState === 'go') {
        const ms = Date.now() - rfStart;
        stats.reflexos.temps.push(ms);
        rfState = 'done';
        addEncert(ms, 'ms');
        document.getElementById('rf-area').innerHTML = `<div class="rf-big">${ms} ms ⚡</div><div class="rf-sub">${ms < 280 ? 'Reflexos de gat!' : ms < 420 ? 'Molt bé!' : 'Segueix entrenant'}</div>`;
        if (!dailyMode) setTimeout(renderReflexos, 1300);
      }
    }

    const COLOR_MAP = [{n:'VERMELL',c:'#FF453A'},{n:'VERD',c:'#30D158'},{n:'GROC',c:'#FFD60A'},{n:'BLAU',c:'#00B4D8'}];
    function rfStroop() {
      const word = COLOR_MAP[Math.floor(RNG()*4)];
      let tinta; do { tinta = COLOR_MAP[Math.floor(RNG()*4)]; } while (tinta.n === word.n);
      const limit = Math.max(1500, 3000 - stats.reflexos.enc * 30);
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">🧠 Toca el color de la <span class="accent">TINTA</span> — temps límit!</div>
        <div class="stroop-word" style="color:${tinta.c};">${word.n}</div>
        <div class="stroop-opts">
          ${COLOR_MAP.map(c => `<div class="stroop-opt" style="border-color:${c.c};color:${c.c};" onclick="stroopTap('${c.n}','${tinta.n}')">${c.n}</div>`).join('')}
        </div>`;
      clearInterval(timerInterval);
      timerInterval = setTimeout(() => { addError(); if (!dailyMode) setTimeout(renderReflexos, 600); }, limit);
    }
    function stroopTap(sel, correcte) {
      clearTimeout(timerInterval);
      if (sel === correcte) addEncert(); else addError();
      if (!dailyMode) setTimeout(renderReflexos, 550);
    }

    const SHAPES_RF = ['🔴','🔵','🟡','🟢','🟣','⭐','🔺','⬛'];
    function rfIntrus() {
      const n = Math.min(16 + Math.floor(stats.reflexos.enc / 5) * 9, 25);
      const cols = n <= 16 ? 4 : 5;
      const base = SHAPES_RF[Math.floor(RNG()*SHAPES_RF.length)];
      let intru; do { intru = SHAPES_RF[Math.floor(RNG()*SHAPES_RF.length)]; } while (intru === base);
      const pos = Math.floor(RNG()*n);
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">⚡ Toca el diferent — <span class="accent" id="intru-count">3</span>s</div>
        <div class="intru-grid" style="grid-template-columns:repeat(${cols},1fr);">
          ${Array.from({length:n}, (_,i) => `<div class="intru-cell" style="font-size:${cols === 5 ? '1.35rem' : '1.7rem'};" onclick="intruTap(${i === pos})">${i === pos ? intru : base}</div>`).join('')}
        </div>`;
      let t = 3;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        t--;
        const el = document.getElementById('intru-count');
        if (el) el.textContent = t;
        if (t <= 0) { clearInterval(timerInterval); addError(); if (!dailyMode) setTimeout(renderReflexos, 700); }
      }, 1000);
    }
    function intruTap(ok) {
      clearInterval(timerInterval);
      if (ok) addEncert(); else addError();
      if (!dailyMode) setTimeout(renderReflexos, 550);
    }

    let counterVal = 0, counterInt = null;
    function rfCounter() {
      const target = 40 + Math.floor(RNG() * 30);
      counterVal = 0;
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">🎯 Para el comptador exactament entre <span class="accent">${target-3} i ${target+3}</span></div>
        <div class="counter-num" id="counter-num">0</div>
        <button class="stop-btn" onclick="counterStop(${target})">STOP</button>`;
      clearInterval(counterInt);
      counterInt = setInterval(() => {
        counterVal = (counterVal + 1) % 100;
        const el = document.getElementById('counter-num');
        if (el) el.textContent = counterVal;
      }, 45);
    }
    function counterStop(target) {
      clearInterval(counterInt);
      const ok = Math.abs(counterVal - target) <= 3;
      if (ok) addEncert(); else addError();
      if (!dailyMode) setTimeout(renderReflexos, 800);
    }

    let notoScore = 0, notoRound = 0, notoTimer = null;
    function rfNoToquis() {
      notoScore = 0; notoRound = 0;
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">🟢 Toca els <span class="accent">VERDS</span> · 🔴 MAI els vermells</div>
        <div class="noto-area" id="noto-area"></div>
        <div class="info-strip" style="margin-top:0.75rem;">Encertats: <span class="accent" id="noto-score">0</span> / 6 verds</div>`;
      notoNext();
    }
    function notoNext() {
      notoRound++;
      if (notoRound > 9) {
        if (notoScore >= 5) addEncert(); else addError();
        if (!dailyMode) setTimeout(renderReflexos, 800);
        return;
      }
      const area = document.getElementById('noto-area');
      if (!area) return;
      area.innerHTML = '';
      const isGreen = notoRound % 3 !== 0; // 6 verds, 3 vermells
      const dot = document.createElement('div');
      dot.className = 'noto-dot';
      dot.style.left = (10 + RNG()*65) + '%';
      dot.style.top = (8 + RNG()*70) + '%';
      dot.style.background = isGreen ? 'rgba(48,209,88,0.85)' : 'rgba(255,69,58,0.85)';
      dot.textContent = isGreen ? '✓' : '✕';
      dot.onclick = () => {
        clearTimeout(notoTimer);
        if (isGreen) { notoScore++; document.getElementById('noto-score').textContent = notoScore; notoNext(); }
        else { addError(); if (!dailyMode) setTimeout(renderReflexos, 800); }
      };
      area.appendChild(dot);
      clearTimeout(notoTimer);
      notoTimer = setTimeout(() => { dot.remove(); notoNext(); }, isGreen ? 850 : 750);
    }

    function rfDoble() {
      const gran = RNG() < 0.5;
      const shape = SHAPES_RF[Math.floor(RNG()*SHAPES_RF.length)];
      const n = 9;
      const bigPos = Math.floor(RNG()*n);
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">👆 Toca ${gran ? 'el <span class="accent">MÉS GRAN</span>' : 'el <span class="accent">MÉS PETIT</span>'} — ràpid!</div>
        <div class="intru-grid" style="grid-template-columns:repeat(3,1fr);">
          ${Array.from({length:n}, (_,i) => `<div class="intru-cell" style="font-size:${i === bigPos ? '2.3rem' : '1.3rem'};" onclick="dobleTap(${gran ? i === bigPos : i !== bigPos && true}, ${i === bigPos}, ${gran})">${shape}</div>`).join('')}
        </div>`;
    }
    function dobleTap(unused, isBig, wantBig) {
      const ok = wantBig ? isBig : !isBig;
      if (ok) addEncert(); else addError();
      if (!dailyMode) setTimeout(renderReflexos, 550);
    }

    let seqRShow = [], seqRInput = [];
    function rfSeqRapida() {
      const set = SHAPES_RF.slice().sort(() => RNG()-.5);
      seqRShow = set.slice(0, 3);
      seqRInput = [];
      const grid6 = set.slice(0, 6).sort(() => RNG()-.5);
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip" id="seqr-status">👀 Memoritza l'ordre: <span style="font-size:1.3rem;">${seqRShow.join(' → ')}</span></div>
        <div class="intru-grid" id="seqr-grid" style="grid-template-columns:repeat(3,1fr);opacity:0.25;pointer-events:none;">
          ${grid6.map(s => `<div class="intru-cell" style="font-size:1.8rem;" onclick="seqRTap('${s}')">${s}</div>`).join('')}
        </div>`;
      setTimeout(() => {
        document.getElementById('seqr-status').innerHTML = 'Toca\'ls en <span class="accent">el mateix ordre</span>!';
        const g = document.getElementById('seqr-grid');
        if (g) { g.style.opacity = '1'; g.style.pointerEvents = 'auto'; }
      }, 1800);

    function seqRTap(s) {
      seqRInput.push(s);
      const pos = seqRInput.length - 1;
      if (seqRShow[pos] !== s) { addError(); if (!dailyMode) setTimeout(renderReflexos, 700); return; }

    // ═══════ 7. PRIORITATS — igual (OK) ═══════
    const PRIO_SETS = [
      {t:'Ordre de prioritat al treball:',items:['Acabar la tasca urgent','Ajudar un company','Assistir a una reunió','Revisar el correu','Formació personal']},

    function renderPrioritats() {
      const set = PRIO_SETS[Math.floor(Math.random()*PRIO_SETS.length)];
      const sh = [...set.items].sort(() => Math.random()-.5);
      document.getElementById('game-arena').innerHTML = `

    function attachPrioTouch() {
      const list = document.getElementById('prio-list');
      let dragEl = null, startY = 0, offsetY = 0;
      list.querySelectorAll('.prio-item').forEach(item => {
        item.addEventListener('touchstart', (e) => { dragEl = item; startY = e.touches[0].clientY; item.classList.add('lifting'); }, { passive: true });
        item.addEventListener('touchmove', (e) => {
          if (!dragEl) return;
          e.preventDefault();
          offsetY = e.touches[0].clientY - startY;
          dragEl.style.transform = `translateY(${offsetY}px)`;
          const siblings = [...list.querySelectorAll('.prio-item')].filter(s => s !== dragEl);
          for (const sib of siblings) {
            const rect = sib.getBoundingClientRect();
            const mid = rect.top + rect.height / 2;
            const dragRect = dragEl.getBoundingClientRect();
            const dragMid = dragRect.top + dragRect.height / 2;
            if (offsetY > 0 && dragMid > mid && sib.compareDocumentPosition(dragEl) & Node.DOCUMENT_POSITION_PRECEDING) {
              sib.after(dragEl); startY = e.touches[0].clientY; offsetY = 0; dragEl.style.transform = '';
            } else if (offsetY < 0 && dragMid < mid && sib.compareDocumentPosition(dragEl) & Node.DOCUMENT_POSITION_FOLLOWING) {
              sib.before(dragEl); startY = e.touches[0].clientY; offsetY = 0; dragEl.style.transform = '';
            }
          }
        }, { passive: false });
        item.addEventListener('touchend', () => {
          if (dragEl) { dragEl.classList.remove('lifting'); dragEl.style.transform = ''; dragEl = null; }
        });
      });
    }
    function prioConfirm() { addResposta(); flash('✓', '#FFD60A'); setTimeout(renderPrioritats, 500); }

    // ═══════ 8. ULL DE DETALL — 7 diferències SVG, Wally, Sopa ═══════
    let detVariant = 0;
    function renderDetall() {
      partidaActiva = true;

      detVariant++;
    }

    // 7 diferències amb escenes SVG il·lustrades
    let diffFound = 0, diffTotal = 0;
    function buildScene(rng) {
      const els = [];
      els.push({ t:'sky' });
      els.push({ t:'mountain', x: 50 + rng()*80, s: 0.8 + rng()*0.5 });
      els.push({ t:'mountain', x: 210 + rng()*80, s: 0.7 + rng()*0.5 });
      els.push({ t:'sun', x: 40 + rng()*60, y: 25 + rng()*15, r: 13 + rng()*5 });
      const nClouds = 2 + Math.floor(rng()*3);
      for (let i = 0; i < nClouds; i++) els.push({ t:'cloud', x: 30 + rng()*270, y: 15 + rng()*32, s: 0.6 + rng()*0.7 });
      els.push({ t:'house', x: 45 + rng()*55, y: 112, w: 72 + rng()*14, c: ['#E8794A','#5B8DEF','#F2C14E','#7BC47F'][Math.floor(rng()*4)], win: 2, door: '#7A4A2B', fum: rng() < 0.6 });
      const nTrees = 2 + Math.floor(rng()*3);
      for (let i = 0; i < nTrees; i++) els.push({ t:'tree', x: 165 + i*48 + rng()*20, y: 118, s: 0.7 + rng()*0.55 });
      const nFlors = 4 + Math.floor(rng()*4);
      for (let i = 0; i < nFlors; i++) els.push({ t:'flower', x: 14 + rng()*300, y: 168 + rng()*22, c: ['#FF5E7A','#FFD60A','#BF5AF2','#FF9F0A','#5B8DEF'][Math.floor(rng()*5)] });
      const nBirds = 2 + Math.floor(rng()*3);
      for (let i = 0; i < nBirds; i++) els.push({ t:'bird', x: 40 + rng()*250, y: 25 + rng()*45 });
      if (rng() < 0.7) els.push({ t:'fence', x: 220 + rng()*50, y: 145 });
      if (rng() < 0.7) els.push({ t:'cat', x: 30 + rng()*260, y: 155 + rng()*20, flip: rng() < 0.5 });
      if (rng() < 0.6) els.push({ t:'butterfly', x: 40 + rng()*250, y: 90 + rng()*40, c: ['#FF5E7A','#BF5AF2','#FFD60A'][Math.floor(rng()*3)] });
      return els;
    }
    function sceneSVG(els, diffIdxs, imgLabel) {
      let s = '';
      els.forEach((e, i) => {
        const isDiff = diffIdxs.includes(i);
        const attr = `data-el="${i}" data-diff="${isDiff ? 1 : 0}" onclick="diffTap(event, ${i}, ${isDiff})" style="cursor:pointer;"`;
        if (e.t === 'sky') s += `<rect x="0" y="0" width="340" height="130" fill="#BEE3F8"/><rect x="0" y="130" width="340" height="70" fill="#9BD08B"/>`;
        if (e.t === 'mountain') s += `<g ${attr}><polygon points="${e.x-45*e.s},130 ${e.x},${130-58*e.s} ${e.x+45*e.s},130" fill="#8FA8BF"/><polygon points="${e.x-12*e.s},${130-42*e.s} ${e.x},${130-58*e.s} ${e.x+12*e.s},${130-42*e.s}" fill="#E8F1F8"/></g>`;
        if (e.t === 'fence') s += `<g ${attr}>${[0,10,20,30].map(o => `<rect x="${e.x+o}" y="${e.y}" width="5" height="18" fill="#A9744B"/>`).join('')}<rect x="${e.x-2}" y="${e.y+4}" width="40" height="4" fill="#8B5E3C"/></g>`;
        if (e.t === 'cat') s += `<g ${attr} transform="translate(${e.x},${e.y})${e.flip ? ' scale(-1,1)' : ''}"><ellipse cx="0" cy="0" rx="11" ry="7" fill="#444"/><circle cx="9" cy="-5" r="5.5" fill="#444"/><polygon points="6,-9 7.5,-13 9.5,-9" fill="#444"/><polygon points="9,-9 11,-13 12.5,-9" fill="#444"/><path d="M-10 0 Q-16 -4 -14 -10" stroke="#444" stroke-width="2.5" fill="none"/></g>`;
        if (e.t === 'butterfly') s += `<g ${attr}><ellipse cx="${e.x-4}" cy="${e.y}" rx="4.5" ry="6" fill="${e.c}"/><ellipse cx="${e.x+4}" cy="${e.y}" rx="4.5" ry="6" fill="${e.c}"/><rect x="${e.x-1}" y="${e.y-5}" width="2" height="10" fill="#333"/></g>`;
        if (e.t === 'sun') s += `<circle ${attr} cx="${e.x}" cy="${e.y}" r="${e.r}" fill="#FFD24A"/>`;
        if (e.t === 'cloud') s += `<g ${attr} transform="translate(${e.x},${e.y}) scale(${e.s})"><ellipse cx="0" cy="0" rx="20" ry="10" fill="#fff"/><ellipse cx="14" cy="-4" rx="14" ry="9" fill="#fff"/><ellipse cx="-13" cy="-3" rx="12" ry="8" fill="#fff"/></g>`;
        if (e.t === 'house') s += `<g ${attr}><rect x="${e.x-e.w/2}" y="${e.y-38}" width="${e.w}" height="38" fill="${e.c}"/><polygon points="${e.x-e.w/2-8},${e.y-38} ${e.x},${e.y-62} ${e.x+e.w/2+8},${e.y-38}" fill="#B0483A"/>${e.fum ? `<rect x="${e.x+e.w/4}" y="${e.y-58}" width="7" height="14" fill="#8B5E3C"/><circle cx="${e.x+e.w/4+4}" cy="${e.y-64}" r="4" fill="#DDD" opacity="0.8"/><circle cx="${e.x+e.w/4+8}" cy="${e.y-70}" r="3" fill="#DDD" opacity="0.6"/>` : ''}${e.win >= 1 ? `<rect x="${e.x-e.w/2+8}" y="${e.y-30}" width="12" height="12" fill="#DCF1FF" stroke="#555"/>` : ''}${e.win >= 2 ? `<rect x="${e.x+e.w/2-20}" y="${e.y-30}" width="12" height="12" fill="#DCF1FF" stroke="#555"/>` : ''}<rect x="${e.x-7}" y="${e.y-19}" width="14" height="19" fill="${e.door}"/></g>`;
        if (e.t === 'tree') s += `<g ${attr} transform="translate(${e.x},${e.y}) scale(${e.s})"><rect x="-4" y="-16" width="8" height="18" fill="#7A4A2B"/><circle cx="0" cy="-26" r="16" fill="#3E9B4F"/></g>`;
        if (e.t === 'flower') s += `<g ${attr}><circle cx="${e.x}" cy="${e.y}" r="5" fill="${e.c}"/><circle cx="${e.x}" cy="${e.y}" r="2" fill="#fff"/></g>`;
        if (e.t === 'bird') s += `<path ${attr} d="M${e.x-7} ${e.y} Q${e.x-3} ${e.y-5} ${e.x} ${e.y} Q${e.x+3} ${e.y-5} ${e.x+7} ${e.y}" stroke="#333" stroke-width="2" fill="none"/>`;
      });
      s += `<text x="8" y="195" font-size="10" fill="#666" font-weight="bold">${imgLabel}</text>`;
      return `<svg viewBox="0 0 340 200">${s}</svg>`;
    }
    function detDiferencies() {
      const seed = dailyMode ? seedFrom(todayStr() + '-diff') : Math.floor(Math.random()*1e9);
      const rngA = mulberry32(seed);
      const els = buildScene(rngA);
      // Tria diferències (elements modificables)
      const modificables = els.map((e, i) => ({ e, i })).filter(x => x.e.t !== 'sky');
      modificables.sort(() => rngA()-.5);
      const nDiffs = Math.min(7, modificables.length);
      const diffIdxs = modificables.slice(0, nDiffs).map(x => x.i);
      const elsB = els.map((e, i) => {
        if (!diffIdxs.includes(i)) return e;
        const m = { ...e };
        if (e.t === 'sun') m.r = e.r * 1.3;
        if (e.t === 'cloud') m.s = e.s * 1.35;
        if (e.t === 'house') { m.c = e.c === '#E8794A' ? '#5B8DEF' : '#E8794A'; m.win = 1; m.fum = !e.fum; }
        if (e.t === 'tree') m.s = e.s * 1.3;
        if (e.t === 'flower') m.c = e.c === '#FFD60A' ? '#FF5E7A' : '#FFD60A';
        if (e.t === 'bird') m.y = e.y + 16;
        if (e.t === 'mountain') m.s = e.s * 1.25;
        if (e.t === 'fence') m.y = e.y - 10;
        if (e.t === 'cat') m.flip = !e.flip;
        if (e.t === 'butterfly') m.c = e.c === '#FFD60A' ? '#BF5AF2' : '#FFD60A';
        return m;
      });
      diffFound = 0; diffTotal = nDiffs;
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">🔎 Troba les <span class="accent">${nDiffs} diferències</span> tocant-les a la imatge de baix · <span class="accent" id="det-timer">0s</span></div>
        <div class="diff-found" id="diff-found">0 / ${nDiffs} trobades</div>
        <div class="diff-scene">${sceneSVG(els, [], 'ORIGINAL')}</div>
        <div class="diff-scene" id="scene-b">${sceneSVG(elsB, diffIdxs, 'TROBA-LES AQUÍ')}</div>`;
      startGameTimer('det-timer');
    }
    function diffTap(ev, elIdx, isDiff) {
      ev.stopPropagation();
      const target = ev.target.closest('[data-el]') || ev.target;
      if (!isDiff) return;
      if (target.dataset.found) return;
      target.dataset.found = '1';
      target.style.opacity = '0.35';
      diffFound++;
      document.getElementById('diff-found').textContent = diffFound + ' / ' + diffTotal + ' trobades';
      if (diffFound >= diffTotal) {
        clearInterval(gameTimerInterval);
        stats.detall.temps.push(gameSeconds);

        if (!dailyMode) setTimeout(renderDetall, 1100);

    // Parella Exacta — troba la seqüència que coincideix EXACTAMENT amb l'objectiu
    const PE_SYMS = ['🔺','🔵','⭐','🔻','🟡','🟣','⬛','🟢'];
    function detWally() {
      const len = 4;
      const target = [];
      for (let i = 0; i < len; i++) target.push(PE_SYMS[Math.floor(RNG()*PE_SYMS.length)]);
      const n = Math.min(12 + Math.floor(stats.detall.enc / 5) * 4, 20);
      const pos = Math.floor(RNG()*n);
      const cells = [];
      for (let i = 0; i < n; i++) {
        if (i === pos) { cells.push([...target]); continue; }
        // Variants subtils: un símbol canviat, dos intercanviats, o invertida
        const v = [...target];
        const mode = Math.floor(RNG()*3);
        if (mode === 0) {
          const p = Math.floor(RNG()*len);
          let alt; do { alt = PE_SYMS[Math.floor(RNG()*PE_SYMS.length)]; } while (alt === v[p]);
          v[p] = alt;
        } else if (mode === 1) {
          const p = Math.floor(RNG()*(len-1));
          if (v[p] !== v[p+1]) { [v[p], v[p+1]] = [v[p+1], v[p]]; } else { v[p] = PE_SYMS[Math.floor(RNG()*PE_SYMS.length)]; }
        } else {
          v.reverse();
          if (v.join('') === target.join('')) v[0] = PE_SYMS[(PE_SYMS.indexOf(v[0])+1) % PE_SYMS.length];
        }
        if (v.join('') === target.join('')) v[len-1] = PE_SYMS[(PE_SYMS.indexOf(v[len-1])+1) % PE_SYMS.length];
        cells.push(v);
      }
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">🎯 Troba la seqüència <span class="accent">EXACTAMENT igual</span> · <span class="accent" id="det-timer">0s</span></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
          ${cells.map((c, i) => `<div style="text-align:center;font-size:1.1rem;letter-spacing:0.2rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:0.7rem 0.3rem;cursor:pointer;" onclick="peTap(${i === pos})">${c.join('')}</div>`).join('')}
        </div>`;
      startGameTimer('det-timer');
    }

      if (!ok) { clearInterval(gameTimerInterval); partidaActiva = false; addError(); if (!dailyMode) setTimeout(renderDetall, 800); return; }

    const SOPA_WORDS = ['TALENT','EQUIP','LIDER','FEINA','VALOR','REPTE','EXIT','META','CANVI','FUTUR'];
    let sopaWord = '', sopaCells = [], sopaSel = [];
    function detSopa() {
      sopaWord = SOPA_WORDS[Math.floor(RNG()*SOPA_WORDS.length)];
      const size = 8;
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVXYZ';
      const grid = Array.from({length:size}, () => Array.from({length:size}, () => letters[Math.floor(RNG()*letters.length)]));
      // Col·loca la paraula (horitzontal o vertical)
      const horiz = RNG() < 0.5;
      const row = Math.floor(RNG() * (horiz ? size : size - sopaWord.length));
      const col = Math.floor(RNG() * (horiz ? size - sopaWord.length : size));
      sopaCells = [];
      for (let i = 0; i < sopaWord.length; i++) {
        const r = horiz ? row : row + i;
        const c = horiz ? col + i : col;
        grid[r][c] = sopaWord[i];
        sopaCells.push(r * size + c);
      }
      sopaSel = [];
      document.getElementById('game-arena').innerHTML = `

      startGameTimer('det-timer');
    }

    }
