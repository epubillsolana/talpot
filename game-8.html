      { f:'"No, no, si em sembla bé el canvi..."', ctx:'Dit lentament, mirant els papers, després que li anunciïn que el seu projecte passa a un altre equip.', ans:'Decepció continguda', opts:['Decepció continguda','Entusiasme real','Indiferència total','Alleujament'] },
      { f:'"Que bé que has arribat, ja era hora!"', ctx:'Dit amb somriure tens i mirant el rellotge, 20 minuts després de l\'hora acordada.', ans:'Molèstia dissimulada', opts:['Molèstia dissimulada','Alegria sincera','Sorpresa agradable','Preocupació'] },
      { f:'"Cap problema, ho tinc tot controlat."', ctx:'Dit ràpid, amb la taula plena de papers i tres trucades perdudes.', ans:'Sobrecàrrega negada', opts:['Sobrecàrrega negada','Confiança real','Calma genuïna','Avorriment'] },
      { f:'"Ah, has fet tu la presentació? Interessant."', ctx:'Dit per un company que aspirava a fer-la, amb pausa abans d\'"interessant".', ans:'Enveja continguda', opts:['Enveja continguda','Admiració sincera','Indiferència','Alegria pel company'] },
    ];
    const EMO_CONFLICTES = [
      { s:'La Marta vol lliurar el projecte aviat encara que no estigui perfecte. El Pau vol repassar-ho tot una setmana més. Discuteixen davant l\'equip.', q:'Què necessita realment el Pau?', ans:'Seguretat que la qualitat no comprometrà la seva reputació', opts:['Seguretat que la qualitat no comprometrà la seva reputació','Que li donin la raó davant de tothom','Més temps lliure','Canviar de projecte'] },
      { s:'En Joan interromp constantment la Laia a les reunions. La Laia ha deixat de proposar idees.', q:'Què necessita la Laia?', ans:'Espai segur on la seva veu sigui escoltada', opts:['Espai segur on la seva veu sigui escoltada','Parlar més fort','Un altre equip','Evitar les reunions'] },
      { s:'La cap demana informes diaris detallats. L\'equip ho viu com a desconfiança i perd motivació.', q:'Què necessita probablement la cap?', ans:'Sensació de control davant la incertesa del projecte', opts:['Sensació de control davant la incertesa del projecte','Molestar l\'equip','Més burocràcia','Demostrar poder'] },
      { s:'Un company veterà rebutja totes les propostes noves del júnior sense argumentar-les.', q:'Què hi pot haver darrere del veterà?', ans:'Por que la seva experiència deixi de ser valorada', opts:['Por que la seva experiència deixi de ser valorada','Maldat pura','Mandra','Enveja del sou'] },
    ];

    function renderEmocional() {
      const v = emoVariant % 4;
      emoVariant++;
      if (v === 0) emoSituacio();
      else if (v === 1) emoResposta();
      else if (v === 2) emoSubtext();
      else emoConflicte();
    }
    function emoSituacio() {
      const q = EMO_SITUACIONS[Math.floor(Math.random()*EMO_SITUACIONS.length)];
      const opts = [...q.opts].sort(() => Math.random()-.5);
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">🎭 Què creus que sent <span class="accent">aquesta persona</span>? La teva lectura configura el perfil</div>
        <div class="emo-situacio">${q.s}</div>
        ${opts.map(o => `<div class="emo-opt" onclick="emoTap('${o.replace(/'/g,"\\'")}','${q.ans.replace(/'/g,"\\'")}')">${o}</div>`).join('')}`;
    }
    function emoResposta() {
      const q = EMO_RESPOSTES[Math.floor(Math.random()*EMO_RESPOSTES.length)];
      const opts = [...q.opts].sort(() => Math.random()-.5);
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">💬 <span class="accent">Què respondries tu?</span> No hi ha resposta correcta</div>
        <div class="emo-frase">${q.f}</div>
        <div class="emo-context">${q.ctx}</div>
        ${opts.map(o => `<div class="emo-opt" onclick="emoTap(\`${o}\`,\`${q.ans}\`)">${o}</div>`).join('')}`;
    }
    function emoSubtext() {
      const q = EMO_SUBTEXT[Math.floor(Math.random()*EMO_SUBTEXT.length)];
      const opts = [...q.opts].sort(() => Math.random()-.5);
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">🎭 Què creus que hi ha <span class="accent">darrere</span> d'aquestes paraules?</div>
        <div class="emo-frase">${q.f}</div>
        <div class="emo-context">${q.ctx}</div>
        ${opts.map(o => `<div class="emo-opt" onclick="emoTap('${o.replace(/'/g,"\\'")}','${q.ans.replace(/'/g,"\\'")}')">${o}</div>`).join('')}`;
    }
    function emoConflicte() {
      const q = EMO_CONFLICTES[Math.floor(Math.random()*EMO_CONFLICTES.length)];
      const opts = [...q.opts].sort(() => Math.random()-.5);
      document.getElementById('game-arena').innerHTML = `
        <div class="info-strip">⚖️ Llegeix el conflicte i respon</div>
        <div class="emo-situacio">${q.s}</div>
        <div style="font-size:0.92rem;font-weight:800;margin-bottom:0.7rem;color:#FFD60A;">${q.q}</div>
        ${opts.map(o => `<div class="emo-opt" onclick="emoTap('${o.replace(/'/g,"\\'")}','${q.ans.replace(/'/g,"\\'")}')">${o}</div>`).join('')}`;
    }
    function emoTap(sel, ans) {
      // No hi ha resposta bona o dolenta — la tria configura el perfil
      addResposta();
      flash('✓', '#FFD60A');
      setTimeout(renderEmocional, 550);
    }

    // ═══════ 10. TETRIS ═══════
    const TT_COLS = 10, TT_ROWS = 18;
    const TT_PIECES = [
      { c:'#00B4D8', m:[[1,1,1,1]] },
      { c:'#FFD60A', m:[[1,1],[1,1]] },
      { c:'#BF5AF2', m:[[0,1,0],[1,1,1]] },
      { c:'#30D158', m:[[0,1,1],[1,1,0]] },
      { c:'#FF453A', m:[[1,1,0],[0,1,1]] },
      { c:'#5B8DEF', m:[[1,0,0],[1,1,1]] },
      { c:'#FF9F0A', m:[[0,0,1],[1,1,1]] },
    ];
    let ttBoard = [], ttPiece = null, ttX = 0, ttY = 0, ttScore = 0, ttLines = 0, ttLevel = 1, ttLoop = null, ttActive = false, ttRng = null;

    function stopTetris() { if (ttLoop) { clearInterval(ttLoop); ttLoop = null; } ttActive = false; }

    function renderTetris() {
      partidaActiva = true;
      ttRng = dailyMode ? mulberry32(seedFrom(todayStr() + '-tetris')) : Math.random;
      ttBoard = Array.from({length: TT_ROWS}, () => Array(TT_COLS).fill(null));
      ttScore = 0; ttLines = 0; ttLevel = 1; ttActive = true;
      const cellPx = Math.min(26, Math.floor((window.innerWidth - 110) / TT_COLS));
      document.getElementById('game-arena').innerHTML = `
        <div class="tetris-wrap">
          <div class="tetris-hud"><span>Punts: <strong id="tt-score">0</strong></span><span>Línies: <strong id="tt-lines">0</strong></span><span>Nivell: <strong id="tt-level">1</strong></span></div>
          <div class="tetris-board" id="tt-board" style="grid-template-columns:repeat(${TT_COLS},${cellPx}px);grid-auto-rows:${cellPx}px;"></div>
          <div class="tetris-pad">
            <button class="tp-btn tp-rotate" ontouchstart="event.preventDefault();ttRotate()" onclick="ttRotate()">↺ ROTAR</button>
            <button class="tp-btn" ontouchstart="event.preventDefault();ttMove(-1)" onclick="ttMove(-1)">←</button>
            <button class="tp-btn" id="tt-down"
              ontouchstart="event.preventDefault();ttSoftStart()" ontouchend="ttSoftStop()" ontouchcancel="ttSoftStop()"
              onmousedown="ttSoftStart()" onmouseup="ttSoftStop()" onmouseleave="ttSoftStop()">↓</button>
            <button class="tp-btn" ontouchstart="event.preventDefault();ttMove(1)" onclick="ttMove(1)">→</button>
          </div>
        </div>`;
      const board = document.getElementById('tt-board');
      for (let i = 0; i < TT_COLS * TT_ROWS; i++) {
        const c = document.createElement('div');
        c.className = 'tt-cell';
        c.id = 'tt-' + i;
        board.appendChild(c);
      }
      ttSpawn();
      ttStartLoop();
    }
    function ttStartLoop() {
      if (ttLoop) clearInterval(ttLoop);
      const speed = Math.max(110, 700 - (ttLevel-1) * 90);
      ttLoop = setInterval(() => { if (ttActive) ttStep(); }, speed);
    }
    function ttSpawn() {
      const p = TT_PIECES[Math.floor(ttRng() * TT_PIECES.length)];
      ttPiece = { c: p.c, m: p.m.map(r => [...r]) };
      ttX = Math.floor((TT_COLS - ttPiece.m[0].length) / 2);
      ttY = 0;
      if (ttCollide(ttX, ttY, ttPiece.m)) ttGameOver();
    }
    function ttCollide(x, y, m) {
      for (let r = 0; r < m.length; r++) for (let c = 0; c < m[0].length; c++) {
        if (!m[r][c]) continue;
        const nr = y + r, nc = x + c;
        if (nc < 0 || nc >= TT_COLS || nr >= TT_ROWS) return true;
        if (nr >= 0 && ttBoard[nr][nc]) return true;
      }
      return false;
    }
    function ttStep() {
      if (!ttCollide(ttX, ttY + 1, ttPiece.m)) { ttY++; ttRender(); }
      else ttLock();
    }
    function ttLock() {
      ttPiece.m.forEach((row, r) => row.forEach((v, c) => {
        if (v && ttY + r >= 0) ttBoard[ttY + r][ttX + c] = ttPiece.c;
      }));
      // Línies
      let cleared = 0;
      for (let r = TT_ROWS - 1; r >= 0; r--) {
        if (ttBoard[r].every(v => v)) {
          ttBoard.splice(r, 1);
          ttBoard.unshift(Array(TT_COLS).fill(null));
          cleared++;
          r++;
        }
      }
      if (cleared) {
        ttLines += cleared;
        ttScore += [0, 100, 300, 500, 800][cleared] * ttLevel;
        const newLevel = 1 + Math.floor(ttLines / 3);
        if (newLevel !== ttLevel) {
          ttLevel = newLevel;
          ttStartLoop();
          flash('NIVELL ' + ttLevel + '! ⬆️', '#FFD60A');
        }
        document.getElementById('tt-score').textContent = ttScore;
        document.getElementById('tt-lines').textContent = ttLines;
        document.getElementById('tt-level').textContent = ttLevel;
      }
      ttSpawn();
      ttRender();
    }
    let ttSoftInt = null;
    function ttSoftStart() {
      if (!ttActive) return;
      ttStep();
      clearInterval(ttSoftInt);
      ttSoftInt = setInterval(() => { if (ttActive) ttStep(); }, 60);
    }
    function ttSoftStop() { clearInterval(ttSoftInt); ttSoftInt = null; }
    function ttMove(dir) { if (ttActive && !ttCollide(ttX + dir, ttY, ttPiece.m)) { ttX += dir; ttRender(); } }
    function ttRotate() {
      if (!ttActive) return;
      const m = ttPiece.m;
      const rot = m[0].map((_, c) => m.map(row => row[c]).reverse());
      if (!ttCollide(ttX, ttY, rot)) { ttPiece.m = rot; ttRender(); }
      else if (!ttCollide(ttX - 1, ttY, rot)) { ttX--; ttPiece.m = rot; ttRender(); }
      else if (!ttCollide(ttX + 1, ttY, rot)) { ttX++; ttPiece.m = rot; ttRender(); }
    }
    function ttDrop() { if (ttActive) { while (!ttCollide(ttX, ttY + 1, ttPiece.m)) ttY++; ttRender(); ttLock(); } }
    function ttRender() {
      for (let r = 0; r < TT_ROWS; r++) for (let c = 0; c < TT_COLS; c++) {
        const cell = document.getElementById('tt-' + (r * TT_COLS + c));
        if (cell) cell.style.background = ttBoard[r][c] || '#06182C';
      }
      ttPiece.m.forEach((row, r) => row.forEach((v, c) => {
        if (v && ttY + r >= 0) {
          const cell = document.getElementById('tt-' + ((ttY + r) * TT_COLS + (ttX + c)));
          if (cell) cell.style.background = ttPiece.c;
        }
      }));
    }
    function ttGameOver() {
      stopTetris();
      partidaActiva = false;
      stats.blocs.temps.push(ttScore);
      if (dailyMode) {
        stats.blocs.enc++; stats.blocs.total++; saveStats(); updateHeader();
        completeDaily(true, ttScore, ' pts');
      } else {
        addEncert(ttScore, ' pts');
        setTimeout(renderTetris, 1400);
      }
    }

    renderGameList();
  </script>
</body>
</html>
