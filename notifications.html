<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talpot — Notificaciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; height: 100dvh; font-family: 'Space Grotesk', sans-serif; color: #fff; overflow-x: hidden; }
    body {
      background:
        radial-gradient(ellipse 100% 50% at 50% 0%, rgba(0,180,216,0.15) 0%, transparent 60%),
        linear-gradient(180deg, #020B18 0%, #041E3A 40%, #0D3B6E 75%, #1264B8 100%);
      background-attachment: fixed;
    }

    .nav {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.25rem;
      background: rgba(2,11,24,0.7); backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 50;
    }
    .nav-title { font-size: 1rem; font-weight: 800; }
    .nav-back { font-size: 1.1rem; cursor: pointer; color: rgba(255,255,255,0.85); font-weight: 700; }
    .nav-clear { font-size: 0.78rem; font-weight: 700; color: rgba(255,255,255,0.3); cursor: pointer; }
    .nav-clear:hover { color: #FFD60A; }

    .scroll { padding-top: 56px; padding-bottom: 80px; overflow-y: auto; min-height: 100dvh; }
    .scroll::-webkit-scrollbar { display: none; }

    /* TABS */
    .tabs { display: flex; padding: 1rem 1.25rem 0.75rem; gap: 0.5rem; }
    .tab { padding: 0.4rem 1rem; border-radius: 100px; font-size: 0.78rem; font-weight: 700; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.4); transition: all 0.2s; }
    .tab.active { background: rgba(255,214,10,0.12); border-color: rgba(255,214,10,0.3); color: #FFD60A; }

    /* GRUP DATA */
    .date-group { padding: 0 1.25rem; margin-bottom: 1.25rem; }
    .date-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 0.6rem; padding-left: 0.25rem; }

    /* NOTIF CARD */
    .notif-list { display: flex; flex-direction: column; gap: 0.5rem; }

    .notif-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; padding: 0.9rem 1rem;
      display: flex; align-items: flex-start; gap: 0.85rem;
      cursor: pointer; transition: background 0.2s;
      position: relative;
    }
    .notif-card:hover { background: rgba(255,255,255,0.08); }
    .notif-card.unread { border-color: rgba(255,214,10,0.15); background: rgba(255,214,10,0.03); }

    .unread-bar {
      position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 3px; border-radius: 0 2px 2px 0;
      background: #FFD60A;
    }

    .notif-icon {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }

    /* Colors per tipus */
    .icon-seeker { background: rgba(0,180,216,0.15); }
    .icon-message { background: rgba(191,90,242,0.15); }
    .icon-showtime { background: rgba(48,209,88,0.15); }
    .icon-champions { background: rgba(255,214,10,0.12); }
    .icon-game { background: rgba(0,180,216,0.12); }
    .icon-creator { background: rgba(255,107,0,0.12); }
    .icon-system { background: rgba(255,255,255,0.08); }

    .notif-body { flex: 1; min-width: 0; }
    .notif-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.25rem; }
    .notif-title { font-size: 0.88rem; font-weight: 700; color: #fff; line-height: 1.3; }
    .notif-time { font-size: 0.65rem; color: rgba(255,255,255,0.25); font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    .notif-desc { font-size: 0.78rem; color: rgba(255,255,255,0.45); line-height: 1.4; margin-bottom: 0.4rem; }

    .notif-action {
      display: inline-flex; font-size: 0.68rem; font-weight: 700;
      padding: 0.2rem 0.55rem; border-radius: 100px; cursor: pointer;
    }
    .action-yellow { background: rgba(255,214,10,0.12); color: #FFD60A; border: 1px solid rgba(255,214,10,0.25); }
    .action-green { background: rgba(48,209,88,0.12); color: #30D158; border: 1px solid rgba(48,209,88,0.2); }
    .action-blue { background: rgba(0,180,216,0.1); color: #00B4D8; border: 1px solid rgba(0,180,216,0.2); }
    .action-purple { background: rgba(191,90,242,0.1); color: #BF5AF2; border: 1px solid rgba(191,90,242,0.2); }

    /* EMPTY STATE */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 2rem; text-align: center; gap: 0.75rem; }
    .empty-icon { font-size: 3rem; opacity: 0.3; }
    .empty-text { font-size: 0.9rem; color: rgba(255,255,255,0.3); font-weight: 500; }

    /* NAV BOTTOM */
    .nav-bottom {
      position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
      display: flex; align-items: center; justify-content: space-around;
      background: rgba(2,11,24,0.92); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.06); z-index: 50;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; cursor: pointer; opacity: 0.35; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; color: #fff; }
    .nav-item.active { opacity: 1; }
    .nav-item.active .nav-icon { color: #FFD60A; }
    .nav-icon { font-size: 1.3rem; line-height: 1; position: relative; }
    .notif-dot { position: absolute; top: -2px; right: -4px; width: 8px; height: 8px; border-radius: 50%; background: #FF2D55; border: 2px solid #020B18; }
  </style>
  <link rel="stylesheet" href="talpot-style.css" />
</head>
<body>

  <nav class="nav">
    <div class="nav-back" id="nav-back-notif" onclick="window.location.href=isSeekerN?'seeker.html':'app.html'">← Feed</div>
    <div class="nav-title">Notificaciones</div>
    <div class="nav-clear" onclick="clearAll()">Marcar todo leído</div>
  </nav>

  <div class="scroll">
    <div class="tabs">
      <div class="tab active">Todas</div>
      <div class="tab">Seekers</div>
      <div class="tab">Creators</div>
      <div class="tab">Sistema</div>
    </div>

    <div id="notifs-container">
      <div style="padding:3rem 1.5rem;text-align:center;color:rgba(255,255,255,0.5);">⏳ Carregant avisos...</div>
    </div>

  </div>

  <nav class="nav-bottom" id="nav-bottom-creator">
    <div class="nav-item" onclick="window.location.href='app.html'">
      <div class="nav-icon">🏠</div>
      <span>Feed</span>
    </div>
    <div class="nav-item" onclick="window.location.href='magic-room.html'">
      <div class="nav-icon">✨</div>
      <span>Mi Room</span>
    </div>
    <div class="nav-item active">
      <div class="nav-icon" style="position:relative;">🔔<span class="notif-dot"></span></div>
      <span>Avisos</span>
    </div>
    <div class="nav-item" onclick="window.location.href='profile.html'">
      <div class="nav-icon">👤</div>
      <span>Perfil</span>
    </div>
  </nav>
  <nav class="nav-bottom" id="nav-bottom-seeker" style="display:none;" style="position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:0.55rem 0 calc(0.55rem + env(safe-area-inset-bottom));background:rgba(6,20,38,0.94);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,0.07);z-index:50;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.15rem;font-size:0.58rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;" onclick="window.location.href='seeker.html'">
      <div style="font-size:1.15rem;">🎯</div><span>Buscar</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.15rem;font-size:0.58rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;" onclick="window.location.href='seeker-discover.html'">
      <div style="font-size:1.15rem;">🧭</div><span>Descubrir</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.15rem;font-size:0.58rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;" onclick="window.location.href='seeker-saved.html'">
      <div style="font-size:1.15rem;">🔖</div><span>Guardados</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.15rem;font-size:0.58rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;position:relative;" onclick="window.location.href='messages.html?from=seeker'">
      <div style="font-size:1.15rem;">💬</div><span>Candidatos</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.15rem;font-size:0.58rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;" onclick="window.location.href='seeker-panel.html'">
      <div style="font-size:1.15rem;">⚙️</div><span>Mi cuenta</span>
    </div>
  </nav>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient('https://dlxeqzdgsejoywwwnchi.supabase.co', 'sb_publishable_TVNU00LDMRirtOJ1dCg5vA_-PhbsDJo');
    const ICONS = { like:'❤️', badge:'🏅', repte:'⚡', peticio_seeker:'✉️', video_resposta:'🎥', missatge:'💬', sistema:'🎉' };
    let notifs = [];

    function tempsRelatiu(iso) {
      const diff = (Date.now() - new Date(iso).getTime()) / 60000;
      if (diff < 60) return 'Fa ' + Math.max(1, Math.round(diff)) + ' min';
      if (diff < 1440) return 'Fa ' + Math.round(diff/60) + ' h';
      return 'Fa ' + Math.round(diff/1440) + ' dies';
    }

    const isSeekerN = new URLSearchParams(window.location.search).get('from') === 'seeker';
    if (isSeekerN) {
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('nav-bottom-creator').style.display = 'none';
        document.getElementById('nav-bottom-seeker').style.display = 'flex';
      });
    }

    async function loadNotifs() {
      const cont = document.getElementById('notifs-container');
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      const { data } = await sb.from('notificacions').select('*').eq('user_id', user.id).order('created_at', { ascending: false }).limit(50);
      notifs = data || [];
      if (notifs.length === 0) {
        cont.innerHTML = '<div style="padding:3rem 1.5rem;text-align:center;color:rgba(255,255,255,0.55);line-height:1.7;">🔔<br>Encara no tens avisos.<br>Quan algú interactuï amb tu, ho veuràs aquí.</div>';
        return;
      }
      cont.innerHTML = '<div class="date-group"><div class="notif-list">' + notifs.map(n => `
        <div class="notif-card ${n.llegida ? '' : 'unread'}" onclick="obrirNotif('${n.id}', '${n.link || ''}')">
          ${n.llegida ? '' : '<div class="unread-bar"></div>'}
          <div class="notif-icon">${ICONS[n.tipus] || '🔔'}</div>
          <div class="notif-body">
            <div class="notif-top">
              <div class="notif-title">${n.titol || 'Avís'}</div>
              <div class="notif-time">${tempsRelatiu(n.created_at)}</div>
            </div>
            <div class="notif-text">${n.cos || ''}</div>
          </div>
        </div>`).join('') + '</div></div>';
    }

    async function obrirNotif(id, link) {
      try { await sb.from('notificacions').update({ llegida: true }).eq('id', id); } catch(e) {}
      if (link) window.location.href = link;
      else loadNotifs();
    }

    async function clearAll() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      try { await sb.from('notificacions').update({ llegida: true }).eq('user_id', user.id); } catch(e) {}
      loadNotifs();
    }

    loadNotifs();
  </script>

</body>
</html>
