<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Geo</title>
<style>body{font-family:monospace;background:#020B18;color:#fff;padding:1.5rem;} input{padding:0.8rem;font-size:1rem;width:100%;box-sizing:border-box;margin-bottom:1rem;} pre{background:#0A1E33;padding:1rem;border-radius:10px;white-space:pre-wrap;word-break:break-all;font-size:0.8rem;}</style>
</head>
<body>
<h3>🔧 Test Geo-data</h3>
<input id="q" placeholder="Escribe: Ta" oninput="test()" />
<pre id="out">Escribe algo arriba...</pre>
<script src="geo-data.js"></script>
<script>
function test() {
  const out = document.getElementById('out');
  let txt = '';
  txt += 'window.TALPOT_GEO existe: ' + (typeof window.TALPOT_GEO !== 'undefined') + '\n';
  txt += 'window.TALPOT_GEO.length: ' + (window.TALPOT_GEO ? window.TALPOT_GEO.length : 'N/A') + '\n';
  txt += 'window.geoSuggest existe: ' + (typeof window.geoSuggest === 'function') + '\n\n';
  const val = document.getElementById('q').value;
  if (window.geoSuggest) {
    const res = window.geoSuggest(val);
    txt += 'Resultado geoSuggest("' + val + '"):\n' + JSON.stringify(res, null, 2);
  }
  out.textContent = txt;
}
test();
</script>
</body>
</html>
