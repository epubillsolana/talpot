<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talpot — Perfil Creator</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Space Grotesk', sans-serif; color: #fff; overflow: hidden; }
    body { background: linear-gradient(180deg, #020B18 0%, #041E3A 40%, #0D3B6E 75%, #1264B8 100%); }

    .nav { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; background: rgba(2,11,24,0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 50; }
    .nav-logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
    .nav-logo span { color: #FFD60A; }
    .nav-back { font-size: 1.1rem; cursor: pointer; color: rgba(255,255,255,0.85); font-weight: 700; }

    .scroll { position: fixed; inset: 0; padding-top: 56px; overflow-y: auto; }
    .scroll::-webkit-scrollbar { display: none; }

    /* HERO */
    .hero { display: flex; flex-direction: column; align-items: center; padding: 1.75rem 1.25rem 1.5rem; gap: 0.6rem; text-align: center; }
    .avatar { width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(135deg, #FFD60A, #FF6B00); display: flex; align-items: center; justify-content: center; font-size: 1.9rem; font-weight: 900; color: #020B18; border: 3px solid rgba(255,255,255,0.15); }
    .hero-name { font-size: 1.45rem; font-weight: 900; letter-spacing: -0.5px; }
    .hero-tag { font-size: 0.8rem; color: rgba(255,255,255,0.5); }

    .section { padding: 0 1.25rem; margin-bottom: 1.5rem; }
    .section-title { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 0.75rem; }

    /* VIDEOS */
    .vids-scroll { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.5rem; scroll-snap-type: x mandatory; }
    .vids-scroll::-webkit-scrollbar { display: none; }
    .vid-card { flex: 0 0 200px; scroll-snap-align: start; border-radius: 16px; overflow: hidden; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.1); position: relative; aspect-ratio: 3/4; }
    .vid-card video { width: 100%; height: 100%; object-fit: cover; }
    .vid-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(2,11,24,0.3); cursor: pointer; }
    .vid-play { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,214,10,0.95); color: #020B18; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; padding-left: 3px; }
    .vid-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 0.6rem 0.75rem; background: linear-gradient(transparent, rgba(2,11,24,0.9)); font-size: 0.75rem; font-weight: 700; }

    /* ENTREVISTA — portada + desplegable */
    .mag-portada { background: linear-gradient(160deg, rgba(255,107,0,0.18) 0%, rgba(255,214,10,0.06) 100%); border-radius: 20px; padding: 1.5rem; border: 1px solid rgba(255,107,0,0.2); }
    .mag-badge { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #FF6B00; margin-bottom: 0.6rem; }
    .mag-titol { font-size: clamp(1.3rem, 5.5vw, 1.75rem); font-weight: 900; letter-spacing: -0.5px; line-height: 1.15; margin-bottom: 0.5rem; }
    .mag-sub { font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-bottom: 1.1rem; }
    .mag-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.4rem; border-radius: 100px; background: #FF6B00; color: #fff; font-size: 0.85rem; font-weight: 800; cursor: pointer; border: none; font-family: 'Space Grotesk', sans-serif; box-shadow: 0 4px 18px rgba(255,107,0,0.35); transition: transform 0.15s; }
    .mag-btn:active { transform: scale(0.96); }

    #entrevista-full { max-height: 0; overflow: hidden; transition: max-height 0.5s ease; }
    #entrevista-full.open { max-height: 20000px; }

    .pregunta-block { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 18px; padding: 1.25rem; margin-top: 0.85rem; }
    .pb-num { font-size: 0.62rem; font-weight: 700; color: #FF6B00; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.45rem; }
    .pb-pregunta { font-size: 0.92rem; font-weight: 800; color: rgba(255,255,255,0.92); line-height: 1.4; margin-bottom: 0.7rem; font-style: italic; }
    .pb-pregunta::before { content: '— '; color: #FF6B00; }
    .pb-transcripcio { font-size: 0.87rem; color: rgba(255,255,255,0.72); line-height: 1.75; margin-bottom: 0.9rem; }
    .pb-bottom { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
    .pb-audio { display: flex; align-items: center; gap: 0.6rem; background: rgba(0,180,216,0.1); border: 1px solid rgba(0,180,216,0.2); border-radius: 100px; padding: 0.55rem 1rem; cursor: pointer; transition: background 0.2s; }
    .pb-audio:hover { background: rgba(0,180,216,0.18); }
    .pb-audio-text { font-size: 0.74rem; font-weight: 700; color: #00B4D8; }
    .pb-stars { display: flex; gap: 0.25rem; }
    .star { font-size: 1.25rem; color: rgba(255,255,255,0.18); cursor: pointer; transition: color 0.15s; }
    .star.active { color: #FFD60A; }

    /* ANÀLISI EXECUTIVE */
    .exec-card { background: linear-gradient(135deg, rgba(0,180,216,0.1), rgba(191,90,242,0.07)); border: 1px solid rgba(0,180,216,0.25); border-radius: 20px; padding: 1.4rem; }
    .exec-badge { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #00B4D8; background: rgba(0,180,216,0.12); border: 1px solid rgba(0,180,216,0.25); border-radius: 100px; padding: 0.3rem 0.75rem; margin-bottom: 0.9rem; }
    .exec-intro { font-size: 0.9rem; color: rgba(255,255,255,0.88); line-height: 1.75; font-weight: 500; margin-bottom: 0.85rem; }
    .exec-point { display: flex; gap: 0.6rem; align-items: flex-start; margin-bottom: 0.55rem; font-size: 0.83rem; color: rgba(255,255,255,0.72); line-height: 1.6; }
    .exec-point:last-child { margin-bottom: 0; }

    /* CARTES SWIPE */
    .cards-hint { text-align: center; font-size: 0.7rem; color: rgba(255,255,255,0.35); margin-bottom: 0.5rem; }
    .cards-wrap { position: relative; height: 420px; }
    .pcard {
      position: absolute; inset: 0;
      border-radius: 22px; overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), opacity 0.3s;
      will-change: transform; touch-action: pan-y;
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 1.4rem;
    }
    .pcard.swiping { transition: none; }
    .pcard-soft { background: linear-gradient(160deg, #2A1B3D 0%, #1A1128 100%); border-color: rgba(191,90,242,0.35); }
    .pcard-tec { background: linear-gradient(160deg, #0A2A3D 0%, #06202E 100%); border-color: rgba(0,180,216,0.35); }
    .pcard-rols { background: linear-gradient(160deg, #3D2A0A 0%, #2E2006 100%); border-color: rgba(255,214,10,0.35); }

    .pc-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
    .pc-icon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .pc-title { font-size: 1.05rem; font-weight: 900; letter-spacing: -0.3px; }
    .pc-sub { font-size: 0.68rem; color: rgba(255,255,255,0.45); }

    .pc-body { flex: 1; overflow-y: auto; }
    .pc-body::-webkit-scrollbar { display: none; }

    .pc-bar-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
    .pc-bar-label { flex: 0 0 105px; font-size: 0.73rem; font-weight: 700; color: rgba(255,255,255,0.75); }
    .pc-bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 100px; overflow: hidden; }
    .pc-bar-fill { height: 100%; border-radius: 100px; transition: width 1s cubic-bezier(0.22,1,0.36,1); }
    .pc-bar-val { flex: 0 0 32px; font-size: 0.68rem; font-weight: 800; text-align: right; }

    .pc-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.65rem 0.85rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; margin-bottom: 0.5rem; font-size: 0.82rem; font-weight: 600; }
    .pc-item-icon { font-size: 1rem; flex-shrink: 0; }

    .pc-empty { text-align: center; color: rgba(255,255,255,0.35); font-size: 0.8rem; padding: 2rem 1rem; font-style: italic; }

    .cards-dots { display: flex; justify-content: center; gap: 0.4rem; margin-top: 0.75rem; }
    .cdot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: all 0.25s; }
    .cdot.active { background: #FFD60A; width: 20px; border-radius: 100px; }

    .empty-mini { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 1rem; text-align: center; font-size: 0.78rem; color: rgba(255,255,255,0.4); }
    .footer-space { height: 3rem; }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-back" onclick="history.back()">← Volver</div>
    <div class="nav-logo">tal<span>pot</span></div>
    <div style="width:60px;"></div>
  </nav>

  <div class="scroll">

    <div class="hero">
      <div class="avatar" id="avatar">?</div>
      <div class="hero-name" id="hero-name">Cargando...</div>
      <div class="hero-tag" id="hero-tag">Creator en Talpot</div>
    </div>

    <!-- MAGIC ROOM -->
    <div class="section">
      <div class="section-title">✨ Magic Room</div>
      <div class="vids-scroll" id="vids-scroll"></div>
    </div>

    <!-- ENTREVISTA -->
    <div class="section">
      <div class="section-title">🎤 Entrevista</div>
      <div id="mag-container"></div>
    </div>

    <!-- ANÀLISI EXECUTIVE -->
    <div class="section">
      <div class="section-title">🤖 Anàlisi del candidat</div>
      <div class="exec-card">
        <div class="exec-badge">IA Talpot · Només visible per a Seekers</div>
        <div id="exec-content"><div style="font-size:0.8rem;color:rgba(255,255,255,0.4);font-style:italic;">Generant anàlisi...</div></div>
      </div>
    </div>

    <!-- CARTES PERFIL -->
    <div class="section">
      <div class="section-title">🃏 Perfil del candidat</div>
      <div class="cards-hint">← Llisca les cartes →</div>
      <div class="cards-wrap" id="cards-wrap"></div>
      <div class="cards-dots" id="cards-dots"></div>
    </div>

    <div class="footer-space"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      'https://dlxeqzdgsejoywwwnchi.supabase.co',
      'sb_publishable_TVNU00LDMRirtOJ1dCg5vA_-PhbsDJo'
    );
    const WORKER_URL = 'https://talpot-ai-v2.e-pubill.workers.dev';

    const CATEGORIES = {
      presentacion: { icon: '🎤', name: 'Presentación' },
      experiencia: { icon: '💼', name: 'Experiencia' },
      estudios: { icon: '🎓', name: 'Estudios' },
      habilidades: { icon: '🧠', name: 'Habilidades' },
      idioma: { icon: '🌍', name: 'Idiomas' },
      objetivos: { icon: '🎯', name: 'Objetivos' },
      hobbies: { icon: '🎨', name: 'Hobbies' }
    };

    const params = new URLSearchParams(window.location.search);
    let targetUserId = params.get('user');
    let dims = [];
    let allKws = [];

    async function loadCreator() {
      if (!targetUserId) {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { window.location.href = 'index6.html'; return; }
        targetUserId = user.id;
        const fullName = user.user_metadata?.full_name || user.user_metadata?.name
          || (user.email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()));
        document.getElementById('hero-name').textContent = fullName;
        document.getElementById('avatar').textContent = fullName.charAt(0).toUpperCase();
      }

      const { data: videos } = await sb.from('magic_room_videos').select('*').eq('user_id', targetUserId).order('created_at', { ascending: false });
      const { data: challenges } = await sb.from('challenge_respostes').select('*').eq('user_id', targetUserId).order('created_at', { ascending: true });

      // Badge CV — el Seeker sap que existeix
      try {
        const { data: cvList } = await sb.storage.from('cvs').list(targetUserId);
        if (cvList && cvList.length > 0) {
          document.getElementById('hero-tag').innerHTML = 'Creator en Talpot · <span style="color:#00B4D8;font-weight:700;">📄 CV disponible sota petició</span>';
        }
      } catch(e) {}

      allKws = [...new Set((videos || []).flatMap(v => v.keywords || []))];

      renderVideos(videos || []);
      renderEntrevista(challenges || []);
      analyzeAndRender(challenges || [], videos || []);
    }

    function renderVideos(videos) {
      const wrap = document.getElementById('vids-scroll');
      if (videos.length === 0) {
        wrap.innerHTML = '<div class="empty-mini" style="flex:1;">Aquest Creator encara no té vídeos</div>';
        return;
      }
      wrap.innerHTML = '';
      videos.forEach((v, i) => {
        const cat = CATEGORIES[v.categoria] || { icon: '🎬', name: v.categoria };
        const card = document.createElement('div');
        card.className = 'vid-card';
        card.innerHTML = `
          <video src="${v.video_url}" playsinline preload="metadata" id="cv-${i}"></video>
          <div class="vid-overlay" id="cvo-${i}" onclick="playVid(${i})"><div class="vid-play">▶</div></div>
          <div class="vid-label">${cat.icon} ${cat.name}</div>
        `;
        wrap.appendChild(card);
      });
    }

    function playVid(i) {
      const vid = document.getElementById('cv-' + i);
      const ov = document.getElementById('cvo-' + i);
      if (vid.paused) {
        document.querySelectorAll('video').forEach(v => { if (v !== vid) v.pause(); });
        vid.play();
        ov.style.display = 'none';
        vid.onclick = () => { vid.pause(); ov.style.display = 'flex'; };
        vid.onended = () => { ov.style.display = 'flex'; };
      }
    }

    function renderEntrevista(challenges) {
      const container = document.getElementById('mag-container');
      if (challenges.length === 0) {
        container.innerHTML = '<div class="empty-mini">Aquest Creator encara no ha fet la roda de premsa</div>';
        return;
      }

      const nom = document.getElementById('hero-name').textContent;
      const millorTitular = [...challenges].sort((a,b) => (b.estrelles||0)-(a.estrelles||0)).find(c => c.titular)?.titular || nom + ', sense filtres';

      let html = `
        <div class="mag-portada">
          <div class="mag-badge">⚡ Roda de premsa Talpot</div>
          <div class="mag-titol">${millorTitular}</div>
          <div class="mag-sub">${nom} · ${challenges.length} preguntes · Sense edició</div>
          <button class="mag-btn" onclick="toggleEntrevista(this)">📖 Ver entrevista completa</button>
        </div>
        <div id="entrevista-full">
      `;

      const sorted = [...challenges].sort((a, b) => (b.estrelles || 0) - (a.estrelles || 0));

      sorted.forEach((c, i) => {
        html += `
          <div class="pregunta-block">
            <div class="pb-num">Pregunta ${i + 1}</div>
            <div class="pb-pregunta">${c.pregunta}</div>
            ${c.transcripcio ? '<div class="pb-transcripcio">«' + c.transcripcio + '»</div>' : ''}
            <div class="pb-bottom">
              ${c.audio_url ? `
                <div class="pb-audio" onclick="playAudio('${c.audio_url}', this)">
                  <span>▶️</span><span class="pb-audio-text">Escuchar respuesta</span>
                </div>` : '<div></div>'}
              <div class="pb-stars">
                ${[1,2,3,4,5].map(s => `<span class="star ${(c.estrelles||0) >= s ? 'active' : ''}" onclick="rate('${c.id}', ${s}, this)">★</span>`).join('')}
              </div>
            </div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    function toggleEntrevista(btn) {
      const full = document.getElementById('entrevista-full');
      const open = full.classList.toggle('open');
      btn.innerHTML = open ? '✕ Cerrar entrevista' : '📖 Ver entrevista completa';
    }

    let currentAudio = null;
    function playAudio(url, el) {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      const audio = new Audio(url);
      currentAudio = audio;
      const txt = el.querySelector('.pb-audio-text');
      txt.textContent = 'Escuchando...';
      audio.play();
      audio.onended = () => { txt.textContent = 'Escuchar respuesta'; currentAudio = null; };
    }

    async function rate(id, stars, el) {
      const wrap = el.parentElement;
      wrap.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < stars));
      await sb.from('challenge_respostes').update({ estrelles: stars }).eq('id', id);
    }

    // ═══════ ANÀLISI + CARTES ═══════
    async function analyzeAndRender(challenges, videos) {
      const transcripcions = challenges.filter(c => c.transcripcio).map(c => c.transcripcio).join(' ');
      const text = transcripcions.toLowerCase();

      dims = [
        { nom: 'Lideratge', kw: ['equip','liderar','decidir','decisió','responsab','gestion','dirigir'], color: '#FFD60A' },
        { nom: 'Comunicació', kw: ['explicar','comunicar','parlar','transparen','escoltar','dialoga'], color: '#00B4D8' },
        { nom: 'Resiliència', kw: ['error','fracàs','superar','difícil','pressió','adaptar','aprendre'], color: '#FF6B00' },
        { nom: 'Col·laboració', kw: ['equip','company','junts','ajudar','col·labor','confiança'], color: '#30D158' },
        { nom: 'Orientació resultats', kw: ['objectiu','resultat','èxit','assolir','millora','solucion','prioritz'], color: '#BF5AF2' },
      ];
      dims.forEach(d => {
        let count = 0;
        d.kw.forEach(k => { count += (text.match(new RegExp(k, 'g')) || []).length; });
        d.score = transcripcions ? Math.min(95, 45 + count * 8) : 0;
      });

      // Executive text
      const nom = document.getElementById('hero-name').textContent.split(' ')[0];
      const topDims = [...dims].sort((a, b) => b.score - a.score);
      const nPreguntes = challenges.length;

      let execIntro = '';
      let rols = [];
      try {
        const res = await fetch(WORKER_URL + '/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ transcription: transcripcions.substring(0, 3000), category: 'executive_summary' })
        });
        const data = await res.json();
        if (data.ok && data.analysis) {
          execIntro = data.analysis.summary_for_seeker || '';
          rols = data.analysis.rols || data.analysis.roles || [];
        }
      } catch(e) {}

      if (!execIntro && transcripcions) {
        execIntro = `${nom} presenta un perfil amb ${nPreguntes} respostes espontànies analitzades. Destaca especialment en ${topDims[0].nom.toLowerCase()} i ${topDims[1].nom.toLowerCase()}. L'estil de resposta és directe, amb referències concretes a experiències reals, cosa que indica un perfil pràctic i orientat a l'acció.`;
      } else if (!transcripcions) {
        execIntro = 'Encara no hi ha prou contingut per generar una anàlisi completa del candidat.';
      }

      const execEl = document.getElementById('exec-content');
      execEl.innerHTML = `
        <div class="exec-intro">${execIntro}</div>
        ${transcripcions ? `
          <div class="exec-point"><span>💪</span><span><strong style="color:#FFD60A;">Fortalesa principal:</strong> ${topDims[0].nom} — patró consistent en les respostes</span></div>
          <div class="exec-point"><span>📈</span><span><strong style="color:#BF5AF2;">Àrea amb menys evidència:</strong> ${topDims[topDims.length-1].nom}</span></div>
          <div class="exec-point"><span>🔍</span><span><strong style="color:#30D158;">Fiabilitat:</strong> ${nPreguntes >= 8 ? 'Alta' : nPreguntes >= 4 ? 'Mitjana' : 'Baixa'} — ${nPreguntes} respostes analitzades</span></div>
        ` : ''}
      `;

      // Rols fallback basats en keywords
      if (rols.length === 0 && allKws.length > 0) {
        const kwText = allKws.join(' ').toLowerCase();
        if (kwText.includes('comercial') || kwText.includes('vend')) rols.push('Responsable Comercial', 'Business Developer', 'Account Manager');
        if (kwText.includes('gesti') || kwText.includes('project')) rols.push('Project Manager', 'Team Lead');
        if (kwText.includes('mediambient') || kwText.includes('residu') || kwText.includes('contenidor')) rols.push('Gestor de Serveis Ambientals');
        if (rols.length === 0) rols.push('Perfil en construcció — més contingut, més precisió');
      }

      renderCards(rols);
    }

    // ═══════ CARTES SWIPE ═══════
    let cardIdx = 0;
    let cards = [];

    function renderCards(rols) {
      const wrap = document.getElementById('cards-wrap');
      const dots = document.getElementById('cards-dots');
      wrap.innerHTML = '';
      dots.innerHTML = '';
      cardIdx = 0;
      cards = [];

      const softItems = [...dims].sort((a,b) => b.score - a.score);
      const tecItems = allKws.slice(0, 10);

      const defs = [
        {
          cls: 'pcard-soft', icon: '🤝', iconBg: 'rgba(191,90,242,0.18)',
          title: 'Habilitats Soft', sub: 'Com és el candidat',
          body: softItems.some(d => d.score > 0)
            ? softItems.map(d => `
              <div class="pc-bar-row">
                <div class="pc-bar-label">${d.nom}</div>
                <div class="pc-bar-track"><div class="pc-bar-fill" style="width:0%;background:${d.color};" data-w="${d.score}"></div></div>
                <div class="pc-bar-val" style="color:${d.color};">${d.score}%</div>
              </div>`).join('')
            : '<div class="pc-empty">Encara no hi ha prou dades de l\'entrevista</div>'
        },
        {
          cls: 'pcard-tec', icon: '🛠️', iconBg: 'rgba(0,180,216,0.18)',
          title: 'Perfil Tècnic', sub: 'Del CV i vídeos d\'experiència i estudis',
          body: tecItems.length
            ? tecItems.map(t => `<div class="pc-item"><span class="pc-item-icon">▸</span><span>${t}</span></div>`).join('')
            : '<div class="pc-empty">Encara no hi ha vídeos d\'experiència ni estudis</div>'
        },
        {
          cls: 'pcard-rols', icon: '💼', iconBg: 'rgba(255,214,10,0.18)',
          title: 'Perfils Laborals', sub: 'On encaixaria aquest candidat',
          body: rols.length
            ? rols.map(r => `<div class="pc-item"><span class="pc-item-icon">🎯</span><span>${r}</span></div>`).join('')
            : '<div class="pc-empty">Anàlisi de perfils en construcció</div>'
        }
      ];

      defs.forEach((d, i) => {
        const card = document.createElement('div');
        card.className = 'pcard ' + d.cls;
        card.innerHTML = `
          <div class="pc-header">
            <div class="pc-icon" style="background:${d.iconBg};">${d.icon}</div>
            <div>
              <div class="pc-title">${d.title}</div>
              <div class="pc-sub">${d.sub}</div>
            </div>
          </div>
          <div class="pc-body">${d.body}</div>
        `;
        wrap.appendChild(card);
        cards.push(card);

        const dot = document.createElement('div');
        dot.className = 'cdot' + (i === 0 ? ' active' : '');
        dots.appendChild(dot);
      });

      layoutCards();
      attachCardSwipe();

      setTimeout(() => {
        document.querySelectorAll('.pc-bar-fill').forEach(f => { f.style.width = f.dataset.w + '%'; });
      }, 300);
    }

    function layoutCards() {
      const n = cards.length;
      cards.forEach((card, i) => {
        const rel = (i - cardIdx + n) % n;
        const scale = Math.max(1 - rel * 0.05, 0.88);
        const ty = Math.min(rel * 12, 26);
        card.style.transform = `translateY(${ty}px) scale(${scale})`;
        card.style.zIndex = 100 - rel;
        card.style.opacity = rel > 2 ? 0 : 1;
        card.style.pointerEvents = rel === 0 ? 'auto' : 'none';
      });
      document.querySelectorAll('.cdot').forEach((d, i) => d.classList.toggle('active', i === cardIdx));
    }

    function attachCardSwipe() {
      let startX = 0, currentX = 0, dragging = false, active = null;
      const wrap = document.getElementById('cards-wrap');

      wrap.addEventListener('touchstart', (e) => {
        if (cards.length === 0) return;
        active = cards[cardIdx];
        startX = e.touches[0].clientX;
        dragging = true;
        active.classList.add('swiping');
      }, { passive: true });

      wrap.addEventListener('touchmove', (e) => {
        if (!dragging || !active) return;
        currentX = e.touches[0].clientX - startX;
        active.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.04}deg)`;
      }, { passive: true });

      wrap.addEventListener('touchend', () => {
        if (!dragging || !active) return;
        dragging = false;
        active.classList.remove('swiping');
        if (currentX < -70) cardIdx = (cardIdx + 1) % cards.length;
        else if (currentX > 70) cardIdx = (cardIdx - 1 + cards.length) % cards.length;
        layoutCards();
        currentX = 0;
        active = null;
      });
    }

    loadCreator();
  </script>

</body>
</html>
