<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talpot — Jocs</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Space Grotesk', sans-serif; color: #fff; overflow: hidden; }
    body { background: linear-gradient(180deg, #020B18 0%, #041E3A 40%, #0D3B6E 75%, #1264B8 100%); }

    .nav { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; background: rgba(2,11,24,0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 50; }
    .nav-logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
    .nav-logo span { color: #FFD60A; }
    .nav-back { font-size: 1.1rem; cursor: pointer; color: rgba(255,255,255,0.85); font-weight: 700; }

    .view { position: fixed; inset: 0; padding-top: 56px; padding-bottom: 64px; overflow-y: auto; transition: opacity 0.25s, transform 0.25s; }
    .view.hidden { opacity: 0; pointer-events: none; transform: scale(0.97); }
    .view::-webkit-scrollbar { display: none; }

    /* LLISTA */
    .games-header { padding: 1.25rem 1.25rem 0.5rem; }
    .games-title { font-size: 1.5rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 0.2rem; }
    .games-sub { font-size: 0.8rem; color: rgba(255,255,255,0.5); }

    .games-grid { display: flex; flex-direction: column; gap: 0.55rem; padding: 0.75rem 1.25rem 1rem; }

    .game-card { border-radius: 16px; padding: 1rem 1.1rem; cursor: pointer; transition: transform 0.15s, background 0.2s; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); }
    .game-card:hover { transform: scale(1.01); background: rgba(255,255,255,0.07); }
    .game-card:active { transform: scale(0.99); }
    .game-card.coming { opacity: 0.55; cursor: default; }
    .game-card.coming:hover { transform: none; }

    .gc-top { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.6rem; }
    .gc-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
    .gc-info { flex: 1; }
    .gc-name { font-size: 0.92rem; font-weight: 800; color: #fff; margin-bottom: 0.15rem; }
    .gc-desc { font-size: 0.72rem; color: rgba(255,255,255,0.55); }
    .gc-right { text-align: right; flex-shrink: 0; }
    .gc-play { font-size: 0.72rem; font-weight: 700; padding: 0.3rem 0.7rem; border-radius: 100px; display: block; margin-bottom: 0.2rem; }
    .play-active { background: #FFD60A; color: #020B18; }
    .play-soon { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.35); border: 1px solid rgba(255,255,255,0.1); }
    .gc-stats { font-size: 0.6rem; color: rgba(255,255,255,0.35); }

    .gc-virtuts { display: flex; gap: 0.35rem; flex-wrap: wrap; padding-top: 0.5rem; border-top: 1px solid rgba(255,255,255,0.06); }
    .gc-virtut-label { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-right: 0.2rem; align-self: center; }
    .gc-virtut { font-size: 0.65rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 100px; }

    /* JOC */
    .game-view { background: #020B18; }
    .game-header { padding: 0.85rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .gh-top { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .gh-icon { font-size: 1.4rem; }
    .gh-name { font-size: 0.95rem; font-weight: 800; flex: 1; }
    .gh-scores { display: flex; gap: 0.75rem; }
    .gh-enc { font-size: 0.75rem; color: #30D158; font-weight: 700; }
    .gh-err { font-size: 0.75rem; color: #FF2D55; font-weight: 700; }
    .gh-virtuts { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .gh-virtut { font-size: 0.62rem; font-weight: 700; padding: 0.18rem 0.5rem; border-radius: 100px; opacity: 0.7; }

    .game-arena { padding: 1rem 1.25rem; }

    /* DECISIONS */
    .dr-situacio { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.1rem; margin-bottom: 1rem; font-size: 0.9rem; color: #fff; line-height: 1.65; min-height: 90px; }
    .dr-opcions { display: flex; flex-direction: column; gap: 0.5rem; }
    .dr-opcio { padding: 0.85rem 1rem; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); cursor: pointer; font-size: 0.83rem; font-weight: 600; color: rgba(255,255,255,0.85); transition: all 0.15s; text-align: left; }
    .dr-opcio:hover { background: rgba(255,214,10,0.1); border-color: rgba(255,214,10,0.3); }
    .dr-opcio.selected { background: rgba(255,214,10,0.15); border-color: #FFD60A; color: #FFD60A; pointer-events: none; }
    .dr-timer { height: 5px; background: rgba(255,255,255,0.08); border-radius: 100px; overflow: hidden; margin-bottom: 0.85rem; }
    .dr-timer-fill { height: 100%; border-radius: 100px; background: #FFD60A; transition: width linear; }
    .dr-timer-fill.urgent { background: #FF2D55; }

    /* MEMÒRIA */
    .mem-grid { display: grid; gap: 0.6rem; }
    .mem-card { aspect-ratio: 1; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; cursor: pointer; transition: all 0.2s; }
    .mem-card.revealed { background: rgba(255,214,10,0.1); border-color: rgba(255,214,10,0.3); }
    .mem-card.matched { background: rgba(48,209,88,0.12); border-color: #30D158; cursor: default; }
    .mem-card.face-down { font-size: 0; }

    /* SEQÜÈNCIES */
    .seq-wrap { text-align: center; }
    .seq-nums { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .seq-num { width: 46px; height: 46px; border-radius: 12px; background: rgba(0,180,216,0.1); border: 1px solid rgba(0,180,216,0.2); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 800; color: #00B4D8; }
    .seq-missing { background: rgba(255,214,10,0.1); border-color: rgba(255,214,10,0.3); color: #FFD60A; font-size: 1.3rem; }
    .seq-options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .seq-opt { padding: 1rem; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); text-align: center; cursor: pointer; font-size: 1.2rem; font-weight: 800; transition: all 0.2s; }
    .seq-opt:hover { background: rgba(0,180,216,0.1); border-color: rgba(0,180,216,0.3); }
    .seq-opt.correct { background: rgba(48,209,88,0.15); border-color: #30D158; color: #30D158; pointer-events: none; }
    .seq-opt.wrong { background: rgba(255,45,85,0.12); border-color: #FF2D55; color: #FF2D55; pointer-events: none; }

    /* SUDOKU */
    .sudoku-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .sudoku-grid { display: grid; grid-template-columns: repeat(9,1fr); gap: 1px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; overflow: hidden; max-width: 320px; width: 100%; }
    .sudoku-grid.grid4 { grid-template-columns: repeat(4,1fr); }
    .sudoku-grid.grid6 { grid-template-columns: repeat(6,1fr); }
    .sdk-cell { background: rgba(2,11,24,0.9); display: flex; align-items: center; justify-content: center; aspect-ratio: 1; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: background 0.15s; border: none; }
    .sdk-cell.given { color: #00B4D8; cursor: default; }
    .sdk-cell.selected { background: rgba(255,214,10,0.15); }
    .sdk-cell.error { background: rgba(255,45,85,0.15); color: #FF2D55; }
    .sdk-cell.correct { color: #30D158; }
    .sdk-cell.box-right { border-right: 2px solid rgba(255,255,255,0.3); }
    .sdk-cell.box-bottom { border-bottom: 2px solid rgba(255,255,255,0.3); }
    .sdk-numpad { display: grid; grid-template-columns: repeat(5,1fr); gap: 0.4rem; max-width: 320px; width: 100%; }
    .sdk-num { padding: 0.6rem; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); text-align: center; cursor: pointer; font-size: 1rem; font-weight: 800; transition: background 0.15s; }
    .sdk-num:hover { background: rgba(0,180,216,0.15); }
    .sdk-erase { background: rgba(255,45,85,0.1); border-color: rgba(255,45,85,0.2); color: #FF2D55; }

    /* LABERINT */
    .maze-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .maze-grid { display: grid; gap: 2px; }
    .maze-controls { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.4rem; width: 130px; }
    .maze-btn { padding: 0.6rem; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); cursor: pointer; text-align: center; font-size: 1.1rem; transition: background 0.15s; }
    .maze-btn:hover { background: rgba(255,255,255,0.12); }
    .maze-btn.empty { visibility: hidden; }

    /* PUNTERIA */
    .punt-area { position: relative; height: 280px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; }
    .punt-target { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid; animation: tAppear 0.2s ease; font-weight: 800; }
    @keyframes tAppear { from { transform: scale(0); } to { transform: scale(1); } }

    /* PRIORITATS */
    .prio-item { padding: 0.85rem 1rem; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); cursor: grab; display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; transition: all 0.15s; }
    .prio-item:hover { background: rgba(255,255,255,0.08); }
    .prio-handle { color: rgba(255,255,255,0.3); }
    .prio-check { padding: 0.75rem 1.5rem; border-radius: 100px; border: none; font-family: 'Space Grotesk', sans-serif; font-weight: 700; background: #FFD60A; color: #020B18; cursor: pointer; font-size: 0.9rem; width: 100%; margin-top: 0.5rem; }

    /* ON ÉS */
    .ones-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .ones-item { padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); cursor: pointer; font-size: 0.85rem; transition: all 0.15s; text-align: center; }
    .ones-item:hover { background: rgba(255,255,255,0.08); }
    .ones-item.correct { background: rgba(48,209,88,0.12); border-color: #30D158; color: #30D158; pointer-events: none; }
    .ones-item.wrong { background: rgba(255,45,85,0.1); border-color: #FF2D55; color: #FF2D55; pointer-events: none; }

    /* NAV */
    .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; justify-content: space-around; background: rgba(2,11,24,0.92); backdrop-filter: blur(16px); border-top: 1px solid rgba(255,255,255,0.06); z-index: 50; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; cursor: pointer; opacity: 0.35; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; color: #fff; }
    .nav-item.active { opacity: 1; }
    .nav-item.active .nav-icon { color: #FFD60A; }
    .nav-icon { font-size: 1.3rem; }
    .nav-center { width: 46px; height: 46px; border-radius: 50%; background: #FFD60A; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; box-shadow: 0 4px 20px rgba(255,214,10,0.35); opacity: 1 !important; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-back" id="nav-back" onclick="goBack()">← Feed</div>
    <div class="nav-logo">tal<span>pot</span></div>
    <div style="width:60px;"></div>
  </nav>

  <div class="view" id="view-list">
    <div class="games-header">
      <div class="games-title">🎮 Jocs</div>
      <div class="games-sub">Cada joc revela virtuts reals. El Seeker les veurà al teu perfil.</div>
    </div>
    <div class="games-grid" id="games-grid"></div>
  </div>

  <div class="view hidden game-view" id="view-game">
    <div class="game-header">
      <div class="gh-top">
        <div class="gh-icon" id="gh-icon">⚡</div>
        <div class="gh-name" id="gh-name">Joc</div>
        <div class="gh-scores">
          <div class="gh-enc">✓ <span id="gh-enc">0</span></div>
          <div class="gh-err">✗ <span id="gh-err">0</span></div>
        </div>
      </div>
      <div class="gh-virtuts" id="gh-virtuts"></div>
    </div>
    <div class="game-arena" id="game-arena"></div>
  </div>

  <nav class="nav-bottom">
    <div class="nav-item" onclick="window.location.href='app.html'"><div class="nav-icon">🏠</div><span>Feed</span></div>
    <div class="nav-item" onclick="window.location.href='magic-room.html'"><div class="nav-icon">✨</div><span>Mi Room</span></div>
    <div class="nav-center" onclick="window.location.href='video-upload.html'">＋</div>
    <div class="nav-item" onclick="window.location.href='creators-feed.html'"><div class="nav-icon">👥</div><span>Creators</span></div>
    <div class="nav-item" onclick="window.location.href='profile.html'"><div class="nav-icon">👤</div><span>Perfil</span></div>
  </nav>

  <script>
    const GAMES = [
      { id:'decisions', icon:'⚡', name:'Decisions Ràpides', desc:'Situació laboral. Tres opcions. Decideix sense pensar massa.', virtuts:[{n:'Lideratge',c:'#FFD60A'},{n:'Intuïció',c:'#FF6B00'},{n:'Gestió pressió',c:'#FF2D55'}], color:'rgba(255,214,10,0.08)', border:'rgba(255,214,10,0.2)', active:true },
      { id:'memoria', icon:'🃏', name:'Memòria Visual', desc:'Troba les parelles. La concentració és clau.', virtuts:[{n:'Atenció',c:'#BF5AF2'},{n:'Memòria',c:'#9B59B6'},{n:'Concentració',c:'#8E44AD'}], color:'rgba(191,90,242,0.07)', border:'rgba(191,90,242,0.2)', active:true },
      { id:'sequencies', icon:'🔢', name:'Seqüències', desc:'Troba la lògica. Completa la sèrie numèrica.', virtuts:[{n:'Lògica',c:'#00B4D8'},{n:'IQ analític',c:'#0096B4'},{n:'Pensament crític',c:'#007A94'}], color:'rgba(0,180,216,0.07)', border:'rgba(0,180,216,0.2)', active:true },
      { id:'sudoku', icon:'🔲', name:'Sudoku', desc:'Omple la graella sense repetir. Paciència i ordre.', virtuts:[{n:'Lògica',c:'#00B4D8'},{n:'Perseverança',c:'#30D158'},{n:'Ordre mental',c:'#28A745'}], color:'rgba(0,180,216,0.06)', border:'rgba(0,180,216,0.15)', active:true },
      { id:'laberint', icon:'🗺️', name:'Laberint', desc:'Troba la sortida. Planifica el camí òptim.', virtuts:[{n:'Orientació espacial',c:'#FF6B00'},{n:'Planificació',c:'#E65C00'},{n:'Resolució',c:'#CC5200'}], color:'rgba(255,107,0,0.07)', border:'rgba(255,107,0,0.18)', active:true },
      { id:'punteria', icon:'🎯', name:'Punteria Mental', desc:'Clica en ordre. Velocitat i precisió sota pressió.', virtuts:[{n:'Velocitat',c:'#00B4D8'},{n:'Precisió',c:'#FF6B00'},{n:'Reflex',c:'#FFD60A'}], color:'rgba(0,180,216,0.06)', border:'rgba(0,180,216,0.15)', active:true },
      { id:'prioritats', icon:'⚖️', name:'Prioritats', desc:'Ordena per importància. Revela els teus valors reals.', virtuts:[{n:'Valors',c:'#BF5AF2'},{n:'Criteri',c:'#9B59B6'},{n:'Decisió',c:'#FFD60A'}], color:'rgba(191,90,242,0.06)', border:'rgba(191,90,242,0.15)', active:true },
      { id:'ones', icon:'🔍', name:'On és?', desc:'Troba l\'element diferent. Atenció al detall màxima.', virtuts:[{n:'Atenció detall',c:'#30D158'},{n:'Percepció',c:'#28A745'},{n:'Precisió visual',c:'#1E8C39'}], color:'rgba(48,209,88,0.06)', border:'rgba(48,209,88,0.15)', active:true },
      { id:'emocional', icon:'🎭', name:'Lectura Emocional', desc:'Identifica l\'emoció de la cara. Intel·ligència emocional.', virtuts:[{n:'Empatia',c:'#FF2D55'},{n:'IE',c:'#FF6B00'},{n:'Intel·ligència social',c:'#FFD60A'}], color:'rgba(255,45,85,0.06)', border:'rgba(255,45,85,0.12)', active:false },
      { id:'blocs', icon:'🧩', name:'Blocs Cau', desc:'Encaixa les peces. Espacialitat i velocitat cognitiva.', virtuts:[{n:'Espacialitat',c:'#30D158'},{n:'Velocitat cognitiva',c:'#00B4D8'},{n:'Gestió estrès',c:'#FF6B00'}], color:'rgba(48,209,88,0.06)', border:'rgba(48,209,88,0.12)', active:false },
    ];

    const stats = {};
    GAMES.forEach(g => { stats[g.id] = { enc:0, err:0 }; });

    function renderGameList() {
      const grid = document.getElementById('games-grid');
      grid.innerHTML = '';
      GAMES.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card' + (g.active ? '' : ' coming');
        card.style.background = g.color;
        card.style.borderColor = g.border;
        card.innerHTML = `
          <div class="gc-top">
            <div class="gc-icon" style="background:${g.color};">${g.icon}</div>
            <div class="gc-info">
              <div class="gc-name">${g.name}</div>
              <div class="gc-desc">${g.desc}</div>
            </div>
            <div class="gc-right">
              <span class="gc-play ${g.active ? 'play-active' : 'play-soon'}">${g.active ? 'JUGAR →' : 'Pròx.'}</span>
              <div class="gc-stats">✓${stats[g.id].enc} &nbsp;✗${stats[g.id].err}</div>
            </div>
          </div>
          <div class="gc-virtuts">
            <span class="gc-virtut-label">Mesura:</span>
            ${g.virtuts.map(v=>`<span class="gc-virtut" style="background:${v.c}22;color:${v.c};border:1px solid ${v.c}44;">${v.n}</span>`).join('')}
          </div>
        `;
        if (g.active) card.onclick = () => startGame(g.id);
        grid.appendChild(card);
      });
    }

    let currentGame = '';
    let enc = 0, err = 0;
    let timerInterval = null;

    function showView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function goBack() {
      clearInterval(timerInterval);
      if (!document.getElementById('view-list').classList.contains('hidden')) {
        window.location.href = 'app.html';
      } else {
        renderGameList();
        showView('view-list');
        document.getElementById('nav-back').textContent = '← Feed';
      }
    }

    function startGame(id) {
      currentGame = id;
      enc = 0; err = 0;
      document.getElementById('gh-enc').textContent = '0';
      document.getElementById('gh-err').textContent = '0';
      const g = GAMES.find(x => x.id === id);
      document.getElementById('gh-icon').textContent = g.icon;
      document.getElementById('gh-name').textContent = g.name;
      // Mostrar virtuts a la capçalera del joc
      document.getElementById('gh-virtuts').innerHTML = g.virtuts.map(v =>
        `<span class="gh-virtut" style="background:${v.c}18;color:${v.c};border:1px solid ${v.c}33;">${v.n}</span>`
      ).join('');
      document.getElementById('nav-back').textContent = '← Jocs';
      showView('view-game');
      renderCurrentGame();
    }

    function addEncert() { enc++; stats[currentGame].enc++; document.getElementById('gh-enc').textContent = enc; }
    function addError() { err++; stats[currentGame].err++; document.getElementById('gh-err').textContent = err; }

    function renderCurrentGame() {
      clearInterval(timerInterval);
      const renders = { decisions:renderDecisions, memoria:renderMemoria, sequencies:renderSequencies, sudoku:renderSudoku, laberint:renderLaberint, punteria:renderPunteria, prioritats:renderPrioritats, ones:renderOnes };
      if (renders[currentGame]) renders[currentGame]();
    }

    // ═══════ DECISIONS RÀPIDES ═══════
    const DECISIONS = [
      {s:"El teu cap t'assigna una tasca impossible d'urgent i tu ja estàs al límit.",ops:["Dic que no puc assumir-ho ara","Ho accepto i reorganitzo les prioritats","Demano ajuda a un company"]},
      {s:"Un company es porta la glòria d'una idea que era teva.",ops:["Ho comento en privat amb ell","Ho deixo passar","Ho menciono al cap discretament"]},
      {s:"Descobreixes un error important hores abans de l'entrega.",ops:["Aviso immediatament al cap","Intento solucionar-ho sol","Ho presento i menciono l'error al final"]},
      {s:"Un client t'insulta durant una reunió.",ops:["Li dic que no parlaré així","Mantinc la calma i continuo","Acabo la reunió educadament"]},
      {s:"Et demanen fer alguna cosa que consideres poc ètica.",ops:["Em nego rotundament","Demano explicacions primer","Ho faig però ho registro tot"]},

    let memFlipped=[],memMatched=0,memTotal=0,memLocked=false;
    function renderMemoria() {
      const pairs=Math.min(4+Math.floor(enc/3),8);
      const emojis=[...EMOJI_SETS[Math.floor(Math.random()*EMOJI_SETS.length)]].slice(0,pairs);
      const cards=[...emojis,...emojis].sort(()=>Math.random()-.5);
      memFlipped=[];memMatched=0;memTotal=pairs;memLocked=false;
      document.getElementById('game-arena').innerHTML=`

    }
    function memFlip(card) {
      if(memLocked||card.classList.contains('matched')||card.classList.contains('revealed')) return;
      card.classList.remove('face-down');card.classList.add('revealed');card.textContent=card.dataset.emoji;
      memFlipped.push(card);
      if(memFlipped.length===2){
        memLocked=true;
        if(memFlipped[0].dataset.emoji===memFlipped[1].dataset.emoji){
          memFlipped.forEach(c=>{c.classList.remove('revealed');c.classList.add('matched');});
          memFlipped=[];memLocked=false;memMatched++;addEncert();
          if(memMatched===memTotal) setTimeout(renderMemoria,1200);
        } else {
          addError();
          setTimeout(()=>{memFlipped.forEach(c=>{c.classList.remove('revealed');c.classList.add('face-down');c.textContent='';});memFlipped=[];memLocked=false;},800);
        }
      }
    }

    // ═══════ SEQÜÈNCIES ═══════
    let seqAns=null,seqStreak=0;
    function genSeq() {
      const d=Math.floor(enc/3);
      const types=[
        ()=>{const s=Math.floor(Math.random()*10)+1,diff=Math.floor(Math.random()*5)+1+d;const n=[s,s+diff,s+diff*2,s+diff*3];return{n,ans:s+diff*4};},
        ()=>{const s=Math.floor(Math.random()*3)+2,m=2+Math.floor(d/2);const n=[s,s*m,s*m*m,s*m*m*m];return{n,ans:s*m*m*m*m};},
        ()=>{const a=Math.floor(Math.random()*5)+1,b=Math.floor(Math.random()*5)+1,c=a+b,e=b+c;return{n:[a,b,c,e],ans:c+e};},
        ()=>{const s=Math.floor(Math.random()*4)+1;return{n:[s*s,(s+1)*(s+1),(s+2)*(s+2),(s+3)*(s+3)],ans:(s+4)*(s+4)};},
      ];
      const g=types[Math.min(d,types.length-1)]();
      const wrongs=[g.ans+Math.floor(Math.random()*5)+1,g.ans-Math.floor(Math.random()*5)-1,g.ans+Math.floor(Math.random()*10)+5].filter(w=>w!==g.ans&&w>0);
      return{...g,opts:[g.ans,...wrongs.slice(0,3)].sort(()=>Math.random()-.5)};
    }
    function renderSequencies() {
      const seq=genSeq();seqAns=seq.ans;
      document.getElementById('game-arena').innerHTML=`
        <div class="seq-wrap">
          <div style="font-size:0.75rem;color:rgba(255,255,255,0.4);margin-bottom:0.75rem;text-align:center;">Quin número completa la sèrie?</div>
          <div class="seq-nums">${seq.n.map(n=>`<div class="seq-num">${n}</div>`).join('')}<div class="seq-num seq-missing">?</div></div>
          <div class="seq-options">${seq.opts.map(o=>`<div class="seq-opt" onclick="seqCheck(this,${o})">${o}</div>`).join('')}</div>
          <div style="text-align:center;font-size:0.7rem;color:rgba(255,255,255,0.3);margin-top:0.75rem;">Ratxa: ${seqStreak}</div>
        </div>
      `;
    }
    function seqCheck(el,val) {
      const ok=val===seqAns;
      el.classList.add(ok?'correct':'wrong');
      document.querySelectorAll('.seq-opt').forEach(o=>o.style.pointerEvents='none');
      if(ok){addEncert();seqStreak++;}else{addError();seqStreak=0;}
      setTimeout(renderSequencies,ok?700:1200);
    }

    // ═══════ SUDOKU ═══════
    let sdkGrid=[],sdkGiven=[],sdkSelected=null,sdkSize=4;
    function generateSudoku4() {
      const base=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];
      const g=base.map(r=>[...r]);
      // shuffle
      for(let i=0;i<2;i++){const a=Math.floor(Math.random()*2)*2,b=a+1;[g[a],g[b]]=[g[b],g[a]];}
      return g;
    }
    function renderSudoku() {
      sdkSize=4;
      const full=generateSudoku4();
      sdkGiven=full.map(r=>r.map(()=>false));
      sdkGrid=full.map(r=>[...r]);
      const reveal=Math.max(6,10-Math.floor(enc/4));
      const positions=[];
      for(let r=0;r<4;r++) for(let c=0;c<4;c++) positions.push([r,c]);
      positions.sort(()=>Math.random()-.5);
      const hidden=positions.slice(reveal);
      hidden.forEach(([r,c])=>sdkGrid[r][c]=0);
      full.forEach((row,r)=>row.forEach((_,c)=>{if(sdkGrid[r][c]!==0) sdkGiven[r][c]=true;}));
      sdkSelected=null;
      renderSdkDisplay(full);
    }
    function renderSdkDisplay(solution) {
      window._sdkSolution=solution;
      const arena=document.getElementById('game-arena');
      arena.innerHTML=`
        <div class="sudoku-wrap">
          <div style="font-size:0.75rem;color:rgba(255,255,255,0.4);margin-bottom:0.5rem;">Omple la graella sense repetir 1-${sdkSize} per fila, columna i caixa</div>
          <div class="sudoku-grid grid4" id="sdk-grid"></div>
          <div class="sdk-numpad" id="sdk-pad"></div>
        </div>
      `;
      renderSdkGrid();
      const pad=document.getElementById('sdk-pad');
      for(let n=1;n<=sdkSize;n++){
        const btn=document.createElement('div');
        btn.className='sdk-num';btn.textContent=n;
        btn.onclick=()=>sdkInput(n);pad.appendChild(btn);
      }
      const erase=document.createElement('div');
      erase.className='sdk-num sdk-erase';erase.textContent='✕';
      erase.onclick=()=>sdkInput(0);pad.appendChild(erase);
    }
    function renderSdkGrid() {
      const grid=document.getElementById('sdk-grid');
      if(!grid) return;
      grid.innerHTML='';
      for(let r=0;r<sdkSize;r++) for(let c=0;c<sdkSize;c++){
        const cell=document.createElement('div');
        cell.className='sdk-cell'+(sdkGiven[r][c]?' given':'')+(sdkSelected&&sdkSelected[0]===r&&sdkSelected[1]===c?' selected':'');
        if(sdkSize===4){if(c===1) cell.classList.add('box-right');if(r===1) cell.classList.add('box-bottom');}
        if(sdkGrid[r][c]!==0) cell.textContent=sdkGrid[r][c];
        if(!sdkGiven[r][c]) cell.onclick=()=>{sdkSelected=[r,c];renderSdkGrid();};
        grid.appendChild(cell);
      }
    }
    function sdkInput(n) {
      if(!sdkSelected) return;
      const[r,c]=sdkSelected;
      if(sdkGiven[r][c]) return;
      sdkGrid[r][c]=n;
      // check
      const sol=window._sdkSolution;
      if(n!==0&&sol&&sol[r][c]!==n){addError();}
      // check complete
      let complete=true;
      for(let rr=0;rr<sdkSize;rr++) for(let cc=0;cc<sdkSize;cc++) if(sdkGrid[rr][cc]===0) complete=false;
      if(complete){addEncert();setTimeout(renderSudoku,1000);}
      renderSdkGrid();
    }

    // ═══════ LABERINT ═══════
    let mazeGrid=[],mazeP={r:1,c:1},mazeE={r:0,c:0},mazeS=7;
    function genMaze(s){
      const g=Array.from({length:s},()=>Array(s).fill(1));
      function carve(r,c){
        [[0,2],[2,0],[0,-2],[-2,0]].sort(()=>Math.random()-.5).forEach(([dr,dc])=>{
          const nr=r+dr,nc=c+dc;
          if(nr>0&&nr<s-1&&nc>0&&nc<s-1&&g[nr][nc]===1){g[r+dr/2][c+dc/2]=0;g[nr][nc]=0;carve(nr,nc);}
        });
      }
      g[1][1]=0;carve(1,1);return g;
    }
    function renderLaberint(){
      mazeS=Math.min(7+Math.floor(enc/4)*2,13);if(mazeS%2===0)mazeS++;
      mazeGrid=genMaze(mazeS);mazeP={r:1,c:1};mazeE={r:mazeS-2,c:mazeS-2};
      renderMazeDisp();
    }
    function renderMazeDisp(){
      const cs=Math.min(34,Math.floor(300/mazeS));
      const arena=document.getElementById('game-arena');
      arena.innerHTML=`
        <div class="maze-wrap">
          <div class="maze-grid" style="grid-template-columns:repeat(${mazeS},${cs}px);gap:2px;" id="mdisp"></div>
          <div class="maze-controls">
            <div class="maze-btn empty"></div><div class="maze-btn" onclick="mvP(-1,0)">↑</div><div class="maze-btn empty"></div>
            <div class="maze-btn" onclick="mvP(0,-1)">←</div><div class="maze-btn" onclick="mvP(1,0)">↓</div><div class="maze-btn" onclick="mvP(0,1)">→</div>
          </div>
        </div>
      `;
      const d=document.getElementById('mdisp');
      for(let r=0;r<mazeS;r++) for(let c=0;c<mazeS;c++){
        const cell=document.createElement('div');
        cell.style.cssText=`width:${cs}px;height:${cs}px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:${cs*0.5}px;`;
        if(r===mazeP.r&&c===mazeP.c){cell.style.background='rgba(255,214,10,0.3)';cell.style.border='2px solid #FFD60A';cell.textContent='●';}
        else if(r===mazeE.r&&c===mazeE.c){cell.style.background='rgba(48,209,88,0.25)';cell.style.border='2px solid #30D158';cell.textContent='🏁';}
        else if(mazeGrid[r][c]===1){cell.style.background='rgba(255,255,255,0.08)';}
        else{cell.style.background='rgba(255,255,255,0.02)';}
        d.appendChild(cell);
      }
    }
    function mvP(dr,dc){
      const nr=mazeP.r+dr,nc=mazeP.c+dc;
      if(nr<0||nr>=mazeS||nc<0||nc>=mazeS||mazeGrid[nr][nc]===1) return;
      mazeP={r:nr,c:nc};
      if(nr===mazeE.r&&nc===mazeE.c){addEncert();setTimeout(renderLaberint,800);return;}
      renderMazeDisp();
    }

      {items:['abc','abc','abc','abç','abc','abc'],diff:'abç'},
      {items:['TALPOT','TALPOT','TALPOT','TALBOT','TALPOT','TALPOT'],diff:'TALBOT'},
      {items:['3.14','3.14','3.14','3.41','3.14','3.14'],diff:'3.41'},
      {items:['rn','rn','rn','m','rn','rn'],diff:'m'},
      {items:['🔵🔵','🔵🔵','🔵🔴','🔵🔵','🔵🔵','🔵🔵'],diff:'🔵🔴'},
    ];
    function renderOnes(){
      const set=ONES_SETS[Math.floor(Math.random()*ONES_SETS.length)];
      const sh=[...set.items].sort(()=>Math.random()-.5);
      document.getElementById('game-arena').innerHTML=`
        <div style="font-size:0.82rem;color:rgba(255,255,255,0.65);margin-bottom:0.75rem;font-weight:600;">Troba l'element diferent:</div>
        <div class="ones-grid">${sh.map(item=>`<div class="ones-item" onclick="onesClick(this,'${item}','${set.diff}')">${item}</div>`).join('')}</div>
      `;
    }
    function onesClick(el,val,diff){
      document.querySelectorAll('.ones-item').forEach(i=>i.style.pointerEvents='none');
      if(val===diff){el.classList.add('correct');addEncert();setTimeout(renderOnes,800);}
      else{el.classList.add('wrong');addError();document.querySelectorAll('.ones-item').forEach(i=>{if(i.textContent===diff) i.classList.add('correct');});setTimeout(renderOnes,1200);}
    }

    renderGameList();
  </script>
</body>
</html>
