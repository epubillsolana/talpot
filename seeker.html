<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talpot — Seeker</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Space Grotesk', sans-serif; color: #fff; overflow: hidden; }
    body { background: linear-gradient(180deg, #020B18 0%, #041E3A 40%, #0D3B6E 75%, #1264B8 100%); }

    .nav { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; background: rgba(2,11,24,0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 50; }
    .nav-logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
    .nav-logo span { color: #FFD60A; }
    .nav-back { font-size: 1.1rem; cursor: pointer; color: rgba(255,255,255,0.85); font-weight: 700; }
    .seeker-badge { font-size: 0.62rem; font-weight: 800; padding: 0.3rem 0.7rem; border-radius: 100px; background: rgba(0,180,216,0.15); color: #00B4D8; border: 1px solid rgba(0,180,216,0.35); }

    .scroll { position: fixed; inset: 0; padding-top: 56px; overflow-y: auto; }
    .scroll::-webkit-scrollbar { display: none; }

    .header { padding: 1.5rem 1.25rem 0.75rem; }
    .h-title { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 0.25rem; }
    .h-sub { font-size: 0.82rem; color: rgba(255,255,255,0.55); line-height: 1.5; }

    .search-box { margin: 0.75rem 1.25rem 1rem; display: flex; gap: 0.5rem; }
    .search-input { flex: 1; padding: 0.85rem 1.1rem; border-radius: 100px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 0.88rem; outline: none; }
    .search-input::placeholder { color: rgba(255,255,255,0.35); }
    .search-btn { padding: 0.85rem 1.3rem; border-radius: 100px; border: none; background: #FFD60A; color: #020B18; font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 0.85rem; cursor: pointer; }

    .section { padding: 0 1.25rem; margin-bottom: 1.5rem; }
    .fam-title { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45); margin: 1rem 0 0.5rem; }

    .oferta-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1rem 1.1rem; margin-bottom: 0.55rem; cursor: pointer; display: flex; align-items: center; gap: 0.85rem; transition: transform 0.15s; }
    .oferta-card:active { transform: scale(0.99); }
    .oc-icon { font-size: 1.5rem; flex-shrink: 0; }
    .oc-info { flex: 1; min-width: 0; }
    .oc-titol { font-size: 0.88rem; font-weight: 800; line-height: 1.3; margin-bottom: 0.2rem; }
    .oc-meta { font-size: 0.7rem; color: rgba(255,255,255,0.5); }
    .oc-count { font-size: 0.72rem; font-weight: 800; color: #FFD60A; flex-shrink: 0; text-align: right; }
    .oc-count.zero { color: rgba(255,255,255,0.3); }

    .cand-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1rem; margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.85rem; cursor: pointer; transition: transform 0.15s; }
    .cand-card:active { transform: scale(0.99); }
    .cand-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #FFD60A, #FF6B00); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 900; color: #020B18; flex-shrink: 0; }
    .cand-info { flex: 1; min-width: 0; }
    .cand-nom { font-size: 0.92rem; font-weight: 800; margin-bottom: 0.25rem; }
    .cand-forts { font-size: 0.7rem; color: #30D158; line-height: 1.5; font-weight: 600; }
    .cand-match { flex-shrink: 0; text-align: center; }
    .cand-match-val { font-size: 1.15rem; font-weight: 900; }
    .cand-match-lbl { font-size: 0.58rem; color: rgba(255,255,255,0.4); text-transform: uppercase; font-weight: 700; }

    .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; font-weight: 700; color: #FFD60A; cursor: pointer; margin-bottom: 0.85rem; }
    .oferta-header { background: rgba(255,214,10,0.07); border: 1px solid rgba(255,214,10,0.2); border-radius: 16px; padding: 1.1rem; margin-bottom: 1rem; }
    .oh-titol { font-size: 1.05rem; font-weight: 900; margin-bottom: 0.3rem; }
    .oh-meta { font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-bottom: 0.55rem; }
    .oh-reqs { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .oh-req { font-size: 0.65rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 100px; background: rgba(0,180,216,0.12); color: #00B4D8; border: 1px solid rgba(0,180,216,0.25); }

    .empty { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem 1.25rem; text-align: center; }
    .empty-icon { font-size: 2.5rem; margin-bottom: 0.6rem; }
    .empty-text { font-size: 0.85rem; color: rgba(255,255,255,0.55); line-height: 1.6; }

    .footer-space { height: 3rem; }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-back" onclick="window.location.href='app.html'">← Feed</div>
    <div class="nav-logo">tal<span>pot</span></div>
    <div class="seeker-badge">🔍 SEEKER</div>
  </nav>

  <div class="scroll">
    <div class="header">
      <div class="h-title">💼 Ofertes i talent</div>
      <div class="h-sub">Tria una oferta i la IA t'ordena els candidats per coincidència real amb els requisits.</div>
    </div>

    <div class="search-box">
      <input class="search-input" id="search-input" placeholder="Busca ofertes o competències..." onkeydown="if(event.key==='Enter')searchOfertes()" />
      <button class="search-btn" onclick="searchOfertes()">Buscar</button>
    </div>

    <div class="section" id="view-ofertes"></div>

    <div class="section" id="view-candidats" style="display:none;">
      <div class="back-link" onclick="showOfertes()">← Totes les ofertes</div>
      <div id="oferta-header"></div>
      <div id="cand-list"></div>
    </div>

    <div class="footer-space"></div>
  </div>

  <script src="ofertes-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      'https://dlxeqzdgsejoywwwnchi.supabase.co',
      'sb_publishable_TVNU00LDMRirtOJ1dCg5vA_-PhbsDJo'
    );
    const OFERTES = window.TALPOT_OFERTES || [];
    let candidats = [];

    async function init() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { window.location.href = 'index6.html'; return; }
      const fullName = user.user_metadata?.full_name || user.user_metadata?.name
        || user.email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      try { await sb.from('profiles').upsert({ id: user.id, full_name: fullName }); } catch(e) {}
      await loadCandidats();
      renderOfertes(OFERTES);
    }

    async function loadCandidats() {
      const { data: videos } = await sb.from('magic_room_videos').select('user_id, keywords, transcripcio, extracted, tags');
      const { data: challenges } = await sb.from('challenge_respostes').select('user_id, transcripcio');
      const { data: profiles } = await sb.from('profiles').select('id, full_name');
      const nomMap = {};
      (profiles || []).forEach(p => { nomMap[p.id] = p.full_name; });

      const map = {};
      (videos || []).forEach(v => {
        if (!map[v.user_id]) map[v.user_id] = { user_id: v.user_id, kws: new Set(), text: '', anysExp: 0, perfilsIA: new Set() };
        (v.keywords || []).forEach(k => map[v.user_id].kws.add(k));
        (v.tags || []).forEach(t => map[v.user_id].kws.add(t));
        if (v.transcripcio) map[v.user_id].text += ' ' + v.transcripcio;
        if (v.extracted) {
          (v.extracted.keywords || []).forEach(k => map[v.user_id].kws.add(k));
          (v.extracted.perfils_laborals || []).forEach(p => map[v.user_id].perfilsIA.add(p));
          if (v.extracted.anys_experiencia_total) map[v.user_id].anysExp = Math.max(map[v.user_id].anysExp, v.extracted.anys_experiencia_total);
        }
      });
      (challenges || []).forEach(c => {
        if (!map[c.user_id]) map[c.user_id] = { user_id: c.user_id, kws: new Set(), text: '', anysExp: 0, perfilsIA: new Set() };
        if (c.transcripcio) map[c.user_id].text += ' ' + c.transcripcio;
      });

      candidats = Object.values(map).map(c => ({
        user_id: c.user_id,
        nom: nomMap[c.user_id] || 'Talent Talpot',
        kws: [...c.kws],
        perfilsIA: [...c.perfilsIA],
        text: c.text.toLowerCase(),
        anysExp: c.anysExp,
      }));
    }

    // Match candidat ↔ oferta: tècnic (fort) + soft (mitjà) + experiència
    function matchOferta(cand, oferta) {
      const searchText = (cand.kws.join(' ') + ' ' + cand.perfilsIA.join(' ') + ' ' + cand.text).toLowerCase();
      const kwHits = oferta.kw.filter(k => searchText.includes(k));
      const softHits = (oferta.soft || []).filter(s => searchText.includes(s.toLowerCase()));
      if (kwHits.length === 0 && softHits.length === 0) return { score: 0, forts: [], softForts: [] };
      const kwScore = (kwHits.length / oferta.kw.length) * 60;
      const softScore = oferta.soft?.length ? (softHits.length / oferta.soft.length) * 25 : 0;
      let expScore = 0;
      if (oferta.expMin === 0) expScore = 10;
      else if (cand.anysExp >= oferta.expMin) expScore = 15;
      else if (cand.anysExp > 0) expScore = 7;
      return {
        score: Math.min(98, Math.round(kwScore + softScore + expScore)),
        forts: kwHits,
        softForts: softHits,
      };
    }

    function renderOfertes(list) {
      const view = document.getElementById('view-ofertes');
      document.getElementById('view-candidats').style.display = 'none';
      view.style.display = 'block';
      const fams = [...new Set(list.map(o => o.fam))];
      view.innerHTML = fams.map(fam => `
        <div class="fam-title">${fam}</div>
        ${list.filter(o => o.fam === fam).map(o => {
          const n = candidats.filter(c => matchOferta(c, o).score > 0).length;
          return `
            <div class="oferta-card" onclick="showCandidats('${o.id}')">
              <div class="oc-icon">${o.icon}</div>
              <div class="oc-info">
                <div class="oc-titol">${o.titol}</div>
                <div class="oc-meta">${o.sector} · ${o.ubicacio} · Exp. mín: ${o.expMin === 0 ? 'sense' : o.expMin + ' any' + (o.expMin > 1 ? 's' : '')}</div>
              </div>
              <div class="oc-count ${n === 0 ? 'zero' : ''}">${n === 0 ? '—' : n + ' 🎯'}</div>
            </div>`;
        }).join('')}`).join('');
    }

    function showOfertes() { renderOfertes(OFERTES); }

    function searchOfertes() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      if (!q) { renderOfertes(OFERTES); return; }
      const filtered = OFERTES.filter(o =>
        o.titol.toLowerCase().includes(q) || o.fam.toLowerCase().includes(q)
        || o.sector.toLowerCase().includes(q) || o.kw.some(k => k.includes(q)) || (o.soft || []).some(s => s.toLowerCase().includes(q))
      );
      if (filtered.length) { renderOfertes(filtered); return; }
      // Cap oferta al dataset — la IA genera els requisits d'aquesta tipologia al vol
      const view = document.getElementById('view-ofertes');
      view.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🤖</div>
          <div class="empty-text">"<strong>${q}</strong>" no és al catàleg.<br>La IA pot definir els requisits d'aquesta tipologia i buscar candidats.</div>
          <button class="search-btn" style="margin-top:1rem;" onclick="generarOfertaIA('${q.replace(/'/g,"\\'")}')">✨ Generar amb IA</button>
        </div>`;
    }

    const WORKER_URL = 'https://talpot-ai-v2.e-pubill.workers.dev';
    async function generarOfertaIA(tipologia) {
      const view = document.getElementById('view-ofertes');
      view.innerHTML = `<div class="empty"><div class="empty-icon">🤖</div><div class="empty-text">La IA està definint els requisits de "<strong>${tipologia}</strong>"...</div></div>`;
      try {
        const res = await fetch(WORKER_URL + '/oferta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tipologia })
        });
        const data = await res.json();
        if (data.ok && data.oferta && data.oferta.kw) {
          const o = {
            id: 'ia_' + Date.now(),
            fam: 'Generada per IA',
            icon: '🤖',
            titol: data.oferta.titol || tipologia,
            sector: 'Definida per IA',
            ubicacio: 'Qualsevol',
            expMin: data.oferta.expMin || 0,
            kw: data.oferta.kw.map(k => k.toLowerCase()),
            soft: data.oferta.soft || [],
          };
          OFERTES.push(o);
          showCandidats(o.id);
        } else {
          view.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">No s'ha pogut generar. Torna-ho a provar.</div></div>`;
        }
      } catch(e) {
        view.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Error de connexió amb la IA.</div></div>`;
      }
    }

    function showCandidats(ofertaId) {
      const o = OFERTES.find(x => x.id === ofertaId);
      const matched = candidats
        .map(c => ({ ...c, m: matchOferta(c, o) }))
        .filter(c => c.m.score > 0)
        .sort((a, b) => b.m.score - a.m.score);

      document.getElementById('view-ofertes').style.display = 'none';
      document.getElementById('view-candidats').style.display = 'block';

      document.getElementById('oferta-header').innerHTML = `
        <div class="oferta-header">
          <div class="oh-titol">${o.icon} ${o.titol}</div>
          <div class="oh-meta">${o.sector} · ${o.ubicacio} · Exp. mín: ${o.expMin === 0 ? 'sense experiència' : o.expMin + ' anys'} · ${matched.length} candidat${matched.length !== 1 ? 's' : ''}</div>
          <div class="oh-reqs">${o.kw.slice(0,6).map(k => `<span class="oh-req">${k}</span>`).join('')}${(o.soft||[]).slice(0,3).map(s => `<span class="oh-req" style="background:rgba(191,90,242,0.12);color:#BF5AF2;border-color:rgba(191,90,242,0.25);">${s}</span>`).join('')}</div>
        </div>`;

      const list = document.getElementById('cand-list');
      if (matched.length === 0) {
        list.innerHTML = `<div class="empty"><div class="empty-icon">🔎</div><div class="empty-text">Cap candidat encaixa encara amb aquesta oferta.<br>Apareixeran automàticament quan pugin contingut rellevant.</div></div>`;
        return;
      }
      list.innerHTML = matched.map(c => {
        const color = c.m.score >= 70 ? '#30D158' : c.m.score >= 45 ? '#FFD60A' : '#FF9F0A';
        const forts = [...c.m.forts.slice(0,3), ...c.m.softForts.slice(0,2)];
        return `
        <div class="cand-card" onclick="window.location.href='creator-profile.html?user=${c.user_id}&oferta=${o.id}'">
          <div class="cand-avatar">${c.nom.charAt(0).toUpperCase()}</div>
          <div class="cand-info">
            <div class="cand-nom">${c.nom}${c.anysExp > 0 ? ' <span style="font-size:0.68rem;color:rgba(255,255,255,0.5);font-weight:600;">· ' + c.anysExp + ' anys exp.</span>' : ''}</div>
            <div class="cand-forts">💪 ${forts.join(' · ') || 'coincidència parcial'}</div>
          </div>
          <div class="cand-match">
            <div class="cand-match-val" style="color:${color};">${c.m.score}%</div>
            <div class="cand-match-lbl">Match</div>
          </div>
        </div>`;
      }).join('');
    }

    init();
  </script>

</body>
</html>
