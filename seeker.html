<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talpot — Explorar Talento</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="talpot-style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Space Grotesk', sans-serif; color: #fff; overflow: hidden; }
    body { background: linear-gradient(180deg, #061426 0%, #0A2540 40%, #10406E 75%, #1264B8 100%); }

    .nav { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; background: rgba(6,20,38,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.07); z-index: 50; }
    .nav-logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
    .nav-logo span { color: #FFD60A; }
    .nav-back { font-size: 1.1rem; cursor: pointer; color: rgba(255,255,255,0.85); font-weight: 700; }
    .seeker-badge { font-size: 0.62rem; font-weight: 800; padding: 0.3rem 0.7rem; border-radius: 100px; background: rgba(0,180,216,0.15); color: #00B4D8; border: 1px solid rgba(0,180,216,0.35); cursor:pointer; }

    .scroll { position: fixed; inset: 0; padding-top: 56px; padding-bottom: 76px; overflow-y: auto; }
    .scroll::-webkit-scrollbar { display: none; }

    .header { padding: 1.5rem 1.25rem 0.75rem; }
    .h-title { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.6px; margin-bottom: 0.3rem; }
    .h-sub { font-size: 0.84rem; color: rgba(255,255,255,0.68); line-height: 1.5; }

    .search-box { margin: 0.9rem 1.25rem 0.6rem; display: flex; gap: 0.5rem; }
    .search-input { flex: 1; padding: 0.9rem 1.15rem; border-radius: 100px; border: 1.5px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; outline: none; }
    .search-input::placeholder { color: rgba(255,255,255,0.4); }
    .search-btn { padding: 0.9rem 1.4rem; border-radius: 100px; border: none; background: #FFD60A; color: #020B18; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 0.88rem; cursor: pointer; }

    .filters-row { display: flex; gap: 0.5rem; padding: 0 1.25rem 1rem; flex-wrap: wrap; }
    .filter-chip { font-size: 0.78rem; font-weight: 700; padding: 0.5rem 0.9rem; border-radius: 100px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.14); cursor: pointer; display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
    .filter-chip.active { background: rgba(0,180,216,0.16); border-color: #00B4D8; color: #00B4D8; }

    .suggest-row { padding: 0 1.25rem 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .suggest-chip { font-size: 0.78rem; font-weight: 700; padding: 0.45rem 0.85rem; border-radius: 100px; background: rgba(255,214,10,0.08); border: 1px solid rgba(255,214,10,0.25); color: #FFD60A; cursor: pointer; }

    .section { padding: 0 1.25rem; margin-bottom: 1.5rem; }
    .fam-title { font-size: 1.05rem; font-weight: 900; margin: 0 0 0.7rem; }

    .cand-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1rem; margin-bottom: 0.6rem; }
    .cand-top { display: flex; align-items: center; gap: 0.85rem; cursor: pointer; }
    .cand-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #FFD60A, #FF6B00); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 900; color: #020B18; flex-shrink: 0; }
    .cand-info { flex: 1; min-width: 0; }
    .cand-nom { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.25rem; }
    .cand-forts { font-size: 0.78rem; color: #30D158; line-height: 1.5; font-weight: 600; }
    .cand-loc { font-size: 0.72rem; color: rgba(255,255,255,0.5); margin-top: 0.15rem; }
    .cand-scores { display: flex; gap: 0.6rem; flex-shrink: 0; }
    .cand-match { text-align: center; }
    .cand-match-val { font-size: 1.1rem; font-weight: 900; }
    .cand-match-lbl { font-size: 0.62rem; color: rgba(255,255,255,0.45); text-transform: uppercase; font-weight: 700; }
    .cand-total { text-align: center; padding-left: 0.6rem; border-left: 1px solid rgba(255,255,255,0.1); }
    .cand-total-val { font-size: 1.5rem; font-weight: 900; color: #FFD60A; }

    .fb-row { display: flex; align-items: center; gap: 0.5rem; width: 100%; margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid rgba(255,255,255,0.07); }

    .empty { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2.5rem 1.5rem; text-align: center; }
    .empty-icon { font-size: 2.8rem; margin-bottom: 0.7rem; }
    .empty-text { font-size: 0.88rem; color: rgba(255,255,255,0.65); line-height: 1.7; }

    .footer-space { height: 2rem; }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-back" onclick="window.location.href='app.html'">← Feed</div>
    <div class="nav-logo">tal<span>pot</span></div>
    <div class="seeker-badge" onclick="window.location.href='profile.html'">🔍 SEEKER · Volver a Creator</div>
  </nav>

  <div class="scroll">
    <div class="header">
      <div class="h-title">🔭 Explora talento</div>
      <div class="h-sub">Escribe lo que buscas — un rol, una competencia, un sector. La IA ordena a los candidatos por encaje real y potencial.</div>
    </div>

    <div class="search-box">
      <input class="search-input" id="search-input" placeholder="Ej: logística, ventas, medio ambiente..." onkeydown="if(event.key==='Enter')buscar()" />
      <button class="search-btn" onclick="buscar()">Buscar</button>
    </div>

    <div class="filters-row">
      <div class="filter-chip" id="filter-loc" onclick="toggleLocFilter()">📍 <span id="filter-loc-text">Cualquier ubicación</span></div>
      <div class="filter-chip" id="filter-exp" onclick="cycleExpFilter()">💼 <span id="filter-exp-text">Cualquier experiencia</span></div>
    </div>

    <div class="suggest-row" id="suggest-row"></div>

    <div class="section" id="results-section" style="display:none;">
      <div class="fam-title" id="results-title"></div>
      <div id="cand-list"></div>
    </div>

    <div class="footer-space"></div>
  </div>

  <nav class="nav-bottom" style="position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:0.6rem 0 calc(0.6rem + env(safe-area-inset-bottom));background:rgba(6,20,38,0.94);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,0.07);z-index:50;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.2rem;font-size:0.6rem;font-weight:800;color:#FFD60A;cursor:pointer;">
      <div style="font-size:1.25rem;">🔭</div><span>Explorar</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.2rem;font-size:0.6rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;" onclick="document.getElementById('search-input').focus();">
      <div style="font-size:1.25rem;">🔍</div><span>Buscar</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.2rem;font-size:0.6rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;" onclick="window.location.href='messages.html'">
      <div style="font-size:1.25rem;">💬</div><span>Mensajes</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.2rem;font-size:0.6rem;font-weight:800;color:rgba(255,255,255,0.5);cursor:pointer;" onclick="window.location.href='profile.html'">
      <div style="font-size:1.25rem;">👤</div><span>Mi perfil</span>
    </div>
  </nav>

  <script src="ofertes-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient('https://dlxeqzdgsejoywwwnchi.supabase.co', 'sb_publishable_TVNU00LDMRirtOJ1dCg5vA_-PhbsDJo');
    const OFERTES = window.TALPOT_OFERTES || []; // font de suggeriments de cerca
    let candidats = [];
    let myLoc = null;
    let locFilterOn = false;
    let expFilter = 0; // 0=qualsevol, 1=junior(0-2), 2=mitjà(2-5), 3=senior(5+)
    const EXP_LABELS = ['Cualquier experiencia', 'Junior (0-2 años)', 'Mid (2-5 años)', 'Senior (5+ años)'];

    async function init() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      const fullName = user.user_metadata?.full_name || user.user_metadata?.name || user.email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      try {
        await sb.from('profiles').upsert({ id: user.id, full_name: fullName });
        const { data: prof } = await sb.from('profiles').select('ubicacio').eq('id', user.id).single();
        myLoc = prof?.ubicacio || null;
        document.getElementById('filter-loc-text').textContent = myLoc ? 'Cerca de ' + myLoc : 'Añade tu ubicación en tu perfil';
      } catch(e) {}
      await loadCandidats();
      renderSuggestions();
    }

    async function loadCandidats() {
      const { data: videos } = await sb.from('magic_room_videos').select('user_id, keywords, transcripcio, extracted, tags');
      const { data: challenges } = await sb.from('challenge_respostes').select('user_id, transcripcio');
      const { data: profiles } = await sb.from('profiles').select('id, full_name, ubicacio');
      const { data: partides } = await sb.from('game_partides').select('user_id, ok');

      const nomMap = {}, locMap = {};
      (profiles || []).forEach(p => { nomMap[p.id] = p.full_name; locMap[p.id] = p.ubicacio; });

      const jocsMap = {};
      (partides || []).forEach(p => {
        if (!jocsMap[p.user_id]) jocsMap[p.user_id] = { total: 0, enc: 0 };
        jocsMap[p.user_id].total++;
        if (p.ok === true) jocsMap[p.user_id].enc++;
      });

      const map = {};
      (videos || []).forEach(v => {
        if (!map[v.user_id]) map[v.user_id] = { user_id: v.user_id, kws: new Set(), text: '', anysExp: 0, nChall: 0, nVideos: 0 };
        map[v.user_id].nVideos++;
        (v.keywords || []).forEach(k => map[v.user_id].kws.add(k));
        (v.tags || []).forEach(t => map[v.user_id].kws.add(t));
        if (v.transcripcio) map[v.user_id].text += ' ' + v.transcripcio;
        if (v.extracted) {
          (v.extracted.keywords || []).forEach(k => map[v.user_id].kws.add(k));
          (v.extracted.perfils_laborals || []).forEach(p => map[v.user_id].kws.add(p));
          if (v.extracted.anys_experiencia_total) map[v.user_id].anysExp = Math.max(map[v.user_id].anysExp, v.extracted.anys_experiencia_total);
        }
      });
      (challenges || []).forEach(c => {
        if (!map[c.user_id]) map[c.user_id] = { user_id: c.user_id, kws: new Set(), text: '', anysExp: 0, nChall: 0, nVideos: 0 };
        map[c.user_id].nChall++;
        if (c.transcripcio) map[c.user_id].text += ' ' + c.transcripcio;
      });

      candidats = Object.values(map).map(c => {
        const j = jocsMap[c.user_id] || { total: 0, enc: 0 };
        const jocsScore = j.total > 0 ? Math.min(45, (j.enc / j.total) * 35 + Math.min(10, j.total / 10)) : 0;
        const challScore = Math.min(30, c.nChall * 4);
        const videoScore = Math.min(25, c.nVideos * 5);
        return {
          user_id: c.user_id,
          nom: nomMap[c.user_id] || 'Talent Talpot',
          ubicacio: locMap[c.user_id] || null,
          kws: [...c.kws],
          text: c.text.toLowerCase(),
          anysExp: c.anysExp,
          potencial: Math.round(jocsScore + challScore + videoScore),
        };
      });
    }

    function renderSuggestions() {
      // Keywords més comunes al catàleg, com a inspiració ràpida
      const totes = [...new Set(OFERTES.flatMap(o => o.kw))];
      const mostra = totes.sort(() => Math.random() - .5).slice(0, 8);
      document.getElementById('suggest-row').innerHTML =
        '<div style="width:100%;font-size:0.72rem;font-weight:700;color:rgba(255,255,255,0.45);margin-bottom:0.1rem;">💡 Prueba con:</div>' +
        mostra.map(k => `<span class="suggest-chip" onclick="document.getElementById('search-input').value='${k}';buscar();">${k}</span>`).join('');
    }

    function toggleLocFilter() {
      if (!myLoc) { alert('Añade tu ubicación desde tu perfil para poder filtrar por cercanía.'); return; }
      locFilterOn = !locFilterOn;
      document.getElementById('filter-loc').classList.toggle('active', locFilterOn);
      if (document.getElementById('results-section').style.display !== 'none') buscar(true);
    }
    function cycleExpFilter() {
      expFilter = (expFilter + 1) % 4;
      document.getElementById('filter-exp-text').textContent = EXP_LABELS[expFilter];
      document.getElementById('filter-exp').classList.toggle('active', expFilter > 0);
      if (document.getElementById('results-section').style.display !== 'none') buscar(true);
    }

    function matchText(cand, terms) {
      const searchText = (cand.kws.join(' ') + ' ' + cand.text).toLowerCase();
      const hits = terms.filter(t => searchText.includes(t));
      return { hits, cobertura: terms.length ? hits.length / terms.length : 0 };
    }

    function passaFiltres(c) {
      if (locFilterOn && myLoc) {
        if (!c.ubicacio || !c.ubicacio.toLowerCase().includes(myLoc.toLowerCase().split(',')[0].trim())) return false;
      }
      if (expFilter === 1 && c.anysExp > 2) return false;
      if (expFilter === 2 && (c.anysExp < 2 || c.anysExp > 5)) return false;
      if (expFilter === 3 && c.anysExp < 5) return false;
      return true;
    }

    let lastQuery = '';
    function buscar(keepQuery) {
      const q = keepQuery ? lastQuery : document.getElementById('search-input').value.trim();
      if (!q) return;
      lastQuery = q;
      const terms = q.toLowerCase().split(/[\s,]+/).filter(Boolean);

      const resultats = candidats
        .filter(passaFiltres)
        .map(c => {
          const { hits, cobertura } = matchText(c, terms);
          const encaix = Math.round(Math.min(98, cobertura * 100));
          // PONDERACIÓ: 70% encaix + 30% potencial
          const total = Math.round(encaix * 0.7 + c.potencial * 0.3);
          return { ...c, encaix, hits, total };
        })
        .filter(c => c.encaix > 0 || c.potencial >= 40) // inclou també talent potent encara que no hi hagi match literal
        .sort((a, b) => b.total - a.total);

      document.getElementById('results-section').style.display = 'block';
      document.getElementById('results-title').textContent = `🔍 "${q}" · ${resultats.length} candidato${resultats.length !== 1 ? 's' : ''}`;

      const list = document.getElementById('cand-list');
      if (resultats.length === 0) {
        list.innerHTML = `<div class="empty"><div class="empty-icon">🔎</div><div class="empty-text">Aún no hay candidatos para esta búsqueda.<br>Prueba otros términos o quita filtros.</div></div>`;
        return;
      }

      list.innerHTML = resultats.map(c => {
        const encaixColor = c.encaix >= 70 ? '#30D158' : c.encaix >= 40 ? '#FFD60A' : 'rgba(255,255,255,0.5)';
        const potColor = c.potencial >= 60 ? '#00B4D8' : c.potencial >= 35 ? '#5B8DEF' : 'rgba(255,255,255,0.4)';
        const esDescubrimiento = c.encaix === 0 && c.potencial >= 40;
        return `
        <div class="cand-card" ${esDescubrimiento ? 'style="border-color:rgba(0,180,216,0.35);background:rgba(0,180,216,0.05);"' : ''}>
          <div class="cand-top" onclick="window.location.href='creator-profile.html?user=${c.user_id}&q=${encodeURIComponent(q)}'">
            <div class="cand-avatar">${c.nom.charAt(0).toUpperCase()}</div>
            <div class="cand-info">
              <div class="cand-nom">${c.nom}${c.anysExp > 0 ? ' <span style="font-size:0.7rem;color:rgba(255,255,255,0.5);font-weight:600;">· ' + c.anysExp + ' años exp.</span>' : ''}</div>
              <div class="cand-forts">${esDescubrimiento ? '💎 Perfil potente — no coincide en palabras, pero destaca' : '💪 ' + (c.hits.slice(0,4).join(' · ') || 'coincidencia parcial')}</div>
              ${c.ubicacio ? '<div class="cand-loc">📍 ' + c.ubicacio + '</div>' : ''}
            </div>
            <div class="cand-scores">
              <div class="cand-match"><div class="cand-match-val" style="color:${encaixColor};">${c.encaix}%</div><div class="cand-match-lbl">Encaje</div></div>
              <div class="cand-match"><div class="cand-match-val" style="color:${potColor};">${c.potencial}%</div><div class="cand-match-lbl">Potencial</div></div>
              <div class="cand-total"><div class="cand-total-val">${c.total}</div><div class="cand-match-lbl">Total</div></div>
            </div>
          </div>
          <div class="fb-row">
            <span style="font-size:0.68rem;color:rgba(255,255,255,0.5);font-weight:700;">Ajuste técnico:</span>
            <span>${[1,2,3,4,5].map(s => `<span style="font-size:1.05rem;color:rgba(255,255,255,0.2);cursor:pointer;" onclick="fbRate('${c.user_id}','${q.replace(/'/g,"\\'")}',${c.encaix},${s},this)">★</span>`).join('')}</span>
          </div>
        </div>`;
      }).join('');
    }

    async function fbRate(candidatId, query, scoreApp, estrelles, el) {
      const wrap = el.parentElement;
      [...wrap.children].forEach((s, i) => { s.style.color = i < estrelles ? '#FFD60A' : 'rgba(255,255,255,0.2)'; });
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      try {
        await sb.from('match_feedback').insert({ seeker_id: user.id, candidat_id: candidatId, oferta_id: query, oferta_titol: query, score_app: scoreApp, estrelles: estrelles });
      } catch(e) {}
    }

    init();
  </script>

</body>
</html>
